<!doctype html>
<!--
  Typography and framing layer for the launch media. Driven frame by frame by produce.mjs:
    window.setFrame({ t, src, format })   format: story | landscape
  The Earth image is a real frame of web/index.html; app images are real CI screenshots of the
  macOS app (docs/screenshots/app). Only text, the dimming and the desktop/window frame are drawn here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earth Now launch overlay</title>
<link rel="stylesheet" href="brand.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--space); color: var(--star);
    font-family: var(--f); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #earth { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .lead { font-family: var(--f); font-weight: 400; color: var(--lead); line-height: 1.3; }
  .cap b { display: block; font-family: var(--f); font-weight: 650; font-stretch: 82%; letter-spacing: -0.02em; line-height: 1; color: var(--star); }
  .cap span { display: block; margin-top: .55em; color: var(--muted); }
  .card { border-radius: 12px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 1px rgba(244,242,238,.14); background: #1e1e1e; }
  .card img { display: block; width: 100%; }
  .titlebar { height: 34px; display: flex; align-items: center; justify-content: center; position: relative;
    background: #2a2a2c; font: 600 14px -apple-system, "Inter", sans-serif; color: #e8e8e8; border-bottom: 1px solid #000; }
  .lights { position: absolute; left: 13px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .sodium { color: var(--sodium); }
  .wordmark { display: flex; align-items: center; }
  /* mark next to the wordmark, balanced optically: the round mark is only slightly taller than the
     letters (cap height = 0.70 em in Bricolage at this cut), is centred on the letters (overshoots geometric
     top and bottom equally) and keeps a generous gap */
  .wordmark { gap: 0.28em; }
  .wordmark img { display: block; width: 0.75em; height: 0.75em; position: relative; top: 0; }
  .scrim { position: absolute; inset: 0; pointer-events: none; }
  /* hierarchy: headline (display, the website's cut) > subline (text, muted) > label (small) > meta (mono) */
  .ctr { left: 0; right: 0; text-align: center; }
  .hl { font-family: var(--f); font-stretch: 78%; font-weight: 760; font-variation-settings: 'opsz' 96;
    letter-spacing: -0.028em; line-height: 0.92; color: var(--star); }
  .sub { font-family: var(--f); font-weight: 400; line-height: 1.3; color: var(--muted); }
  .lab b { display: block; font-family: var(--f); font-weight: 600; letter-spacing: -0.01em; color: rgba(244,242,238,.9); }
  .lab span { display: block; margin-top: .5em; font-family: var(--f-mono); font-weight: 500; color: rgba(201,202,210,.8); }
  .h1wrap h1 { display: inline-block; text-align: left; margin: 0; }
</style>
</head>
<body>
<div id="stage"><img id="earth" alt=""></div>
<div id="ui"></div>
<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const clamp = (x) => Math.max(0, Math.min(1, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
// visible between a and d, fading in a..b and out c..d
const win = (t, a, b, c, d) => smooth((t - a) / (b - a)) * (1 - smooth((t - c) / (d - c)));
const rise = (t, a, b, px) => (1 - smooth((t - a) / (b - a))) * px;   // slides up from +px to 0

const ui = document.getElementById('ui');
const earth = document.getElementById('earth');
const stage = document.getElementById('stage');
let built = null;
const el = {};
const shots = 'assets/';  // V1 (launch version) CI screenshots

// The time and Sun position of the recording (20 Mar 2026, 03:00 UTC; planets.js subsolarOfDate)
const READOUT = `<span class="live-dot"></span>20 Mar 2026, 03:00 UTC · Sun overhead at <b style="color:var(--star);font-weight:500">0.2° S, 136.9° E</b>`;
const CAPS = { 'Horizon': 'low over the sunrise line', 'Close-up': 'your region, up close',
  'Whole Earth': 'day, night and the line between', 'Side View': 'the Earth beside your icons' };

function buildStory() {
  ui.innerHTML = '';
  const add = (id, h) => { el[id] = $(h); ui.appendChild(el[id]); };
  const lab = (id, name, top) => add(id, `<div class="abs ctr lab shadow" style="top:${top}px"><b style="font-size:50px">${name}</b><span style="font-size:27px">${CAPS[name]}</span></div>`);
  add('t1', `<div class="abs ctr h1wrap" style="top:330px"><h1 class="mega shadow" style="font-size:176px;font-weight:760"><span class="ln">The Earth,</span><span class="ln">right now.</span></h1></div>`);
  add('r1', `<div class="abs ctr hl shadow" style="top:300px;font-size:132px">The real Earth.</div>`);
  add('r2', `<div class="abs ctr sub shadow" style="top:470px;font-size:44px">Right on your desktop.</div>`);
  add('p1', `<div class="abs ctr hl shadow" style="top:300px;font-size:116px;line-height:1.08">Your location.<br>Your angle.<br><span class="sodium">Your view.</span></div>`);
  lab('v1', 'Horizon', 1420); lab('v2', 'Close-up', 1420); lab('v3', 'Whole Earth', 1420); lab('v4', 'Side View', 1420);
  add('c0', `<div class="abs ctr hl shadow" style="top:262px;font-size:104px">Make it yours.</div>`);
  add('c0s', `<div class="abs ctr sub shadow" style="top:392px;font-size:36px">Pick a view, a place and how it moves.</div>`);
  add('c0t', `<div class="abs ctr sub shadow" style="top:392px;font-size:36px">Fine-tune the framing, clouds and quality.</div>`);
  // nearly full width, so the controls stay readable on a phone; slowly scrolled
  add('c1', `<div class="abs card" style="left:60px;width:960px;top:480px;height:1040px"><img src="${shots}settings-en-dark.png"></div>`);
  add('c2', `<div class="abs card" style="left:60px;width:960px;top:480px;height:1040px"><img src="${shots}settings-en-bottom.png"></div>`);
  add('e1', `<div class="abs ctr shadow" style="top:300px"><div class="wordmark" style="display:inline-flex;font-size:150px"><img src="assets/mark.svg" alt=""><span class="hl">Earth Now</span></div></div>`);
  add('e2', `<div class="abs ctr sub shadow" style="top:1290px;font-size:46px;color:var(--star)">Free and open source for macOS</div>`);
  add('e3', `<div class="abs ctr shadow mono" style="top:1372px;font-size:26px;color:var(--muted)">macOS 13 or later · Apple Silicon and Intel</div>`);
}

function story(t) {
  const o = (id, v, dy = 0) => { el[id].style.opacity = v; el[id].style.transform = `translateY(${dy}px)`; };
  stage.style.opacity = smooth(t / 0.6);  // fade in from black
  o('t1', win(t, 0.5, 1.4, 3.3, 3.9), rise(t, 0.5, 1.5, 24));
  o('r1', win(t, 4.8, 5.6, 10.3, 10.9), rise(t, 4.8, 5.7, 24));
  o('r2', win(t, 5.8, 6.6, 10.3, 10.9), rise(t, 5.8, 6.7, 16));
  o('p1', win(t, 11.4, 12.2, 13.9, 14.5), rise(t, 11.4, 12.3, 24));
  o('v1', win(t, 14.7, 15.2, 15.9, 16.4));
  o('v2', win(t, 18.3, 18.8, 20.0, 20.5));
  o('v3', win(t, 22.7, 23.2, 24.4, 24.9));
  o('v4', win(t, 27.1, 27.6, 28.8, 29.3));
  const cust = win(t, 29.4, 30.0, 34.9, 35.5);
  earth.style.filter = cust > 0.001 ? `blur(${cust * 16}px) brightness(${1 - cust * 0.55})` : 'none';
  o('c0', cust, rise(t, 29.4, 30.1, 16));
  o('c0s', win(t, 30.2, 30.8, 32.3, 32.7));
  o('c0t', win(t, 32.7, 33.2, 34.9, 35.4));
  o('c1', win(t, 30.4, 31.0, 32.4, 32.9), rise(t, 30.4, 31.1, 60));
  o('c2', win(t, 32.4, 32.9, 34.8, 35.3));
  el.c1.firstChild.style.transform = `translateY(${-160 * smooth((t - 30.8) / 1.8)}px)`;
  el.c2.firstChild.style.transform = `translateY(${-160 * smooth((t - 33.0) / 1.8)}px)`;
  o('e1', win(t, 36.0, 36.8, 99, 100), rise(t, 36.0, 36.9, 24));
  o('e2', win(t, 37.0, 37.8, 99, 100), rise(t, 37.0, 37.9, 16));
  o('e3', win(t, 37.6, 38.4, 99, 100), rise(t, 37.6, 38.5, 12));
}

// --- Landscape ---------------------------------------------------------------
// Desktop segment: the live render becomes the wallpaper of a display, with the real settings window on it.
function buildLandscape() {
  ui.innerHTML = '';
  const add = (id, h, parent = ui) => { el[id] = $(h); parent.appendChild(el[id]); };
  const lab = (id, name) => add(id, `<div class="abs ctr lab shadow" style="top:918px"><b style="font-size:40px">${name}</b><span style="font-size:20px">${CAPS[name]}</span></div>`);
  add('scr', `<div class="scrim" style="background:radial-gradient(70% 60% at 50% 50%, rgba(5,6,13,.55) 0%, rgba(5,6,13,0) 75%)"></div>`);
  add('t1', `<div class="abs ctr h1wrap" style="top:330px"><h1 class="mega shadow" style="font-size:200px;font-weight:760"><span class="ln">The Earth,</span><span class="ln">right now.</span></h1></div>`);
  add('r1', `<div class="abs ctr hl shadow" style="top:110px;font-size:124px">The real Earth.</div>`);
  add('r2', `<div class="abs ctr sub shadow" style="top:258px;font-size:40px">Right on your desktop.</div>`);
  // display frame drawn around the stage
  add('bezel', `<div class="abs" style="left:0;top:0;width:1920px;height:1080px;pointer-events:none"></div>`);
  add('menubar', `<div class="abs" style="left:0;top:0;width:1920px;height:30px;display:flex;align-items:center;gap:22px;padding:0 18px;
     background:rgba(16,18,26,.62);font:500 15px -apple-system, Inter, sans-serif;transform-origin:0 0">
     <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
     <span style="margin-left:auto">Fri 20 Mar&nbsp;&nbsp;04:00</span></div>`);
  add('win', `<div class="abs card" style="left:0;top:0;width:640px;transform-origin:0 0">
     <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div>Earth Now</div>
     <img src="${shots}settings-en-dark.png"></div>`);
  add('d1', `<div class="abs ctr hl" style="top:950px;font-size:64px">It's your wallpaper. Live, all day.</div>`);
  add('d0', `<div class="abs ctr sub" style="top:22px;font-size:26px">Lives in the menu bar. Set it once, then forget it.</div>`);
  add('p1', `<div class="abs ctr hl shadow" style="top:110px;font-size:92px">Your location. Your angle. <span class="sodium">Your view.</span></div>`);
  lab('v1', 'Whole Earth'); lab('v2', 'Close-up'); lab('v3', 'Horizon');
  add('e1', `<div class="abs shadow" style="left:0;width:1040px;top:360px;text-align:center"><div class="wordmark" style="display:inline-flex;font-size:140px"><img src="assets/mark.svg" alt=""><span class="hl">Earth Now</span></div></div>`);
  add('e2', `<div class="abs sub shadow" style="left:0;width:1040px;top:560px;text-align:center;font-size:44px;color:var(--star)">The real Earth, right now,<br>as your Mac's desktop.</div>`);
  add('e3', `<div class="abs mono shadow" style="left:0;width:1040px;top:720px;text-align:center;font-size:22px;color:var(--muted)">Free and open source · macOS 13 or later</div>`);
}

function landscape(t) {
  const o = (id, v, dy = 0) => { el[id].style.opacity = v; el[id].style.transform = `translateY(${dy}px)`; };
  stage.style.opacity = smooth(t / 0.6);
  o('scr', win(t, 0, 0.1, 3.4, 4.2));
  o('t1', win(t, 0.5, 1.4, 3.3, 3.9), rise(t, 0.5, 1.5, 22));
  o('r1', win(t, 4.8, 5.6, 10.3, 10.9), rise(t, 4.8, 5.7, 22));
  o('r2', win(t, 5.8, 6.6, 10.3, 10.9), rise(t, 5.8, 6.7, 14));
  // desktop: shrink the stage into a display, hold, grow back
  const d = smooth((t - 12.2) / 1.3) * (1 - smooth((t - 20.6) / 1.0));
  const s = 1 - d * (1 - 0.78), top = d * 90, left = (1920 - 1920 * s) / 2;
  stage.style.transform = `translate(${left}px, ${top}px) scale(${s})`;
  stage.style.transformOrigin = '0 0';
  stage.style.borderRadius = `${d * 16}px`;
  stage.style.boxShadow = d > 0 ? `0 0 0 ${d * 12}px #0b0c10, 0 0 0 ${d * 13}px rgba(255,255,255,.12), 0 30px 120px rgba(0,0,0,${d * .8})` : 'none';
  document.body.style.background = d > 0 ? `radial-gradient(80% 70% at 50% 45%, rgb(${22 * d},${28 * d},${44 * d}), #000)` : '#05060d';
  const mb = el.menubar; mb.style.opacity = smooth((t - 13.2) / 0.5) * (1 - smooth((t - 20.2) / 0.4));
  mb.style.transform = `translate(${left}px, ${top}px) scale(${s})`;
  // first the message, then the window
  o('d1', win(t, 13.8, 14.6, 19.9, 20.5), rise(t, 13.8, 14.7, 16));
  const w = el.win, wv = win(t, 16.0, 16.7, 19.7, 20.3);
  w.style.opacity = wv;
  w.style.transform = `translate(${left + 120 * s}px, ${top + (90 + rise(t, 16.0, 16.8, 40)) * s}px) scale(${s})`;
  o('d0', win(t, 16.6, 17.3, 19.9, 20.5));
  o('p1', win(t, 22.2, 23.0, 24.6, 25.2), rise(t, 22.2, 23.1, 22));
  o('v1', win(t, 25.3, 25.8, 26.5, 27.0));
  o('v2', win(t, 28.9, 29.4, 30.7, 31.2));
  o('v3', win(t, 33.3, 33.8, 35.1, 35.6));
  o('e1', win(t, 37.6, 38.4, 99, 100), rise(t, 37.6, 38.5, 22));
  o('e2', win(t, 38.6, 39.4, 99, 100), rise(t, 38.6, 39.5, 16));
  o('e3', win(t, 39.2, 40.0, 99, 100), rise(t, 39.2, 40.1, 12));
}

window.setFrame = async ({ t, src, format }) => {
  if (built !== format) { (format === 'story' ? buildStory : buildLandscape)(); built = format;
    await Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); }
  earth.src = src;
  await earth.decode();
  (format === 'story' ? story : landscape)(t);
};
</script>
</body>
</html>
