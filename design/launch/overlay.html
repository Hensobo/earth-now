<!doctype html>
<!--
  Typography and framing layer for the launch media. Driven frame by frame by produce.mjs:
    window.setFrame({ t, src, format })   format: story | landscape
  The Earth image is a real frame of web/index.html; app images are real CI screenshots of the
  macOS app (docs/screenshots/app). Only text, the dimming and the desktop/window frame are drawn here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earth Now launch overlay</title>
<link rel="stylesheet" href="brand.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--space); color: var(--star);
    font-family: var(--f); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #earth { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .lead { font-family: var(--f); font-weight: 400; color: var(--lead); line-height: 1.3; }
  .cap b { display: block; font-family: var(--f); font-weight: 650; font-stretch: 82%; letter-spacing: -0.02em; line-height: 1; color: var(--star); }
  .cap span { display: block; margin-top: .55em; color: var(--muted); }
  .card { border-radius: 12px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 1px rgba(244,242,238,.14); background: #1e1e1e; }
  .card img { display: block; width: 100%; }
  .titlebar { height: 34px; display: flex; align-items: center; justify-content: center; position: relative;
    background: #2a2a2c; font: 600 14px -apple-system, "Inter", sans-serif; color: #e8e8e8; border-bottom: 1px solid #000; }
  .lights { position: absolute; left: 13px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .sodium { color: var(--sodium); }
  .wordmark { display: flex; align-items: center; }
  .wordmark img { display: block; }
  .scrim { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><img id="earth" alt=""></div>
<div id="ui"></div>
<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const clamp = (x) => Math.max(0, Math.min(1, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
// visible between a and d, fading in a..b and out c..d
const win = (t, a, b, c, d) => smooth((t - a) / (b - a)) * (1 - smooth((t - c) / (d - c)));
const rise = (t, a, b, px) => (1 - smooth((t - a) / (b - a))) * px;   // slides up from +px to 0

const ui = document.getElementById('ui');
const earth = document.getElementById('earth');
const stage = document.getElementById('stage');
let built = null;
const el = {};
const shots = 'assets/';  // V1 (launch version) CI screenshots

// The time and Sun position of the recording (20 Mar 2026, 03:00 UTC; planets.js subsolarOfDate)
const READOUT = `<span class="live-dot"></span>20 Mar 2026, 03:00 UTC · Sun overhead at <b style="color:var(--star);font-weight:500">0.2° S, 136.9° E</b>`;
const CAPS = { 'Horizon': 'low over the sunrise line', 'Close-up': 'your region, up close',
  'Whole Earth': 'day, night and the line between', 'Side View': 'the Earth beside your icons' };

function buildStory() {
  ui.innerHTML = '';
  const add = (id, h) => { el[id] = $(h); ui.appendChild(el[id]); };
  add('t1', `<h1 class="abs mega shadow" style="left:60px;top:300px;font-size:196px;font-weight:300"><span class="ln">The Earth,</span><span class="ln">right now.</span></h1>`);
  add('ro', `<div class="abs mono shadow" style="left:64px;right:40px;top:1530px;font-size:27px;color:var(--muted)">${READOUT}</div>`);
  add('r1', `<div class="abs mega shadow" style="left:60px;right:40px;top:290px;font-size:150px">The real Earth.</div>`);
  add('r2', `<div class="abs lead shadow" style="left:64px;right:40px;top:440px;font-size:56px">Right on your desktop.</div>`);
  add('p1', `<div class="abs display shadow" style="left:60px;top:290px;font-size:124px">Your location.</div>`);
  add('p2', `<div class="abs display shadow" style="left:60px;top:400px;font-size:124px">Your angle.</div>`);
  add('p3', `<div class="abs display shadow sodium" style="left:60px;top:510px;font-size:124px">Your view.</div>`);
  [['v1', 'Horizon'], ['v2', 'Close-up'], ['v3', 'Whole Earth'], ['v4', 'Side View']].forEach(([id, name]) =>
    add(id, `<div class="abs cap shadow" style="left:64px;top:1430px"><b style="font-size:58px">${name}</b><span class="mono" style="font-size:28px">${CAPS[name]}</span></div>`));
  add('c0', `<div class="abs display shadow" style="left:50px;top:262px;font-size:96px">Make it yours.</div>`);
  add('c0s', `<div class="abs lead shadow" style="left:54px;right:40px;top:360px;font-size:38px">Pick a view, a place and how it moves.</div>`);
  add('c0t', `<div class="abs lead shadow" style="left:54px;right:40px;top:360px;font-size:38px">Fine-tune the framing, clouds and quality.</div>`);
  // nearly full width, so the controls stay readable on a phone; slowly scrolled
  add('c1', `<div class="abs card" style="left:50px;width:980px;top:450px;height:1080px"><img src="${shots}settings-en-dark.png"></div>`);
  add('c2', `<div class="abs card" style="left:50px;width:980px;top:450px;height:1080px"><img src="${shots}settings-en-bottom.png"></div>`);
  add('e1', `<div class="abs wordmark shadow" style="left:60px;top:286px;gap:30px"><img src="assets/mark.svg" style="width:124px;height:124px"><span class="display" style="font-size:150px">Earth Now</span></div>`);
  add('e2', `<div class="abs lead shadow" style="left:64px;right:40px;top:1290px;font-size:54px;color:var(--star)">Free and open source for macOS.</div>`);
  add('e3', `<div class="abs mono shadow" style="left:64px;right:40px;top:1376px;font-size:28px;color:var(--muted)">macOS 13 or later · Apple Silicon and Intel</div>`);
}

function story(t) {
  const o = (id, v, dy = 0) => { el[id].style.opacity = v; el[id].style.transform = `translateY(${dy}px)`; };
  stage.style.opacity = smooth(t / 0.6);  // fade in from black
  o('t1', win(t, 0.4, 1.2, 2.8, 3.4), rise(t, 0.4, 1.3, 24));
  o('r1', win(t, 4.0, 4.8, 9.8, 10.4), rise(t, 4.0, 4.9, 26));
  o('r2', win(t, 4.8, 5.6, 9.8, 10.4), rise(t, 4.8, 5.7, 22));
  // like the website's headline: thin at night, heavy in daylight
  el.r1.style.fontWeight = Math.round(300 + 470 * smooth((t - 6.6) / 3.8));
  o('ro', win(t, 0.8, 1.6, 9.8, 10.4));
  o('p1', win(t, 10.9, 11.5, 22.3, 22.8), rise(t, 10.9, 11.6, 20));
  o('p2', win(t, 14.1, 14.7, 22.3, 22.8), rise(t, 14.1, 14.8, 20));
  o('p3', win(t, 17.9, 18.5, 22.3, 22.8), rise(t, 17.9, 18.6, 20));
  o('v1', win(t, 10.6, 11.0, 12.0, 12.4));
  o('v2', win(t, 13.9, 14.3, 15.6, 16.0));
  o('v3', win(t, 17.7, 18.1, 19.3, 19.7));
  o('v4', win(t, 21.1, 21.5, 22.6, 23.0));
  const cust = win(t, 22.8, 23.4, 27.0, 27.6);
  earth.style.filter = cust > 0.001 ? `blur(${cust * 16}px) brightness(${1 - cust * 0.55})` : 'none';
  o('c0', cust, rise(t, 22.8, 23.4, 16));
  o('c0s', win(t, 22.9, 23.5, 25.0, 25.4));
  o('c0t', win(t, 25.2, 25.6, 27.0, 27.5));
  o('c1', win(t, 23.0, 23.6, 25.1, 25.6), rise(t, 23.0, 23.7, 70));
  o('c2', win(t, 25.1, 25.6, 27.0, 27.5));
  el.c1.firstChild.style.transform = `translateY(${-145 * smooth((t - 23.4) / 2.0)}px)`;
  el.c2.firstChild.style.transform = `translateY(${-145 * smooth((t - 25.4) / 1.8)}px)`;
  o('e1', win(t, 27.4, 28.1, 99, 100), rise(t, 27.4, 28.2, 24));
  o('e2', win(t, 27.9, 28.6, 99, 100), rise(t, 27.9, 28.7, 18));
  o('e3', win(t, 28.2, 28.9, 99, 100), rise(t, 28.2, 29.0, 14));
}

// --- Landscape ---------------------------------------------------------------
// Desktop segment: the live render becomes the wallpaper of a display, with the real settings window on it.
function buildLandscape() {
  ui.innerHTML = '';
  const add = (id, h, parent = ui) => { el[id] = $(h); parent.appendChild(el[id]); };
  add('scr', `<div class="scrim" style="background:radial-gradient(90% 80% at 0% 100%, rgba(5,6,13,.8) 0%, rgba(5,6,13,.35) 45%, rgba(5,6,13,0) 70%)"></div>`);
  add('t1', `<h1 class="abs mega shadow" style="left:72px;top:560px;font-size:210px;font-weight:300"><span class="ln">The Earth,</span><span class="ln">right now.</span></h1>`);
  add('ro', `<div class="abs mono shadow" style="left:80px;top:1010px;font-size:22px;color:var(--muted)">${READOUT}</div>`);
  add('r1', `<div class="abs mega shadow" style="left:72px;top:96px;font-size:150px">The real Earth.</div>`);
  add('r2', `<div class="abs lead shadow" style="left:80px;top:250px;font-size:50px">Right on your desktop.</div>`);
  // display frame drawn around the stage
  add('bezel', `<div class="abs" style="left:0;top:0;width:1920px;height:1080px;pointer-events:none"></div>`);
  add('menubar', `<div class="abs" style="left:0;top:0;width:1920px;height:30px;display:flex;align-items:center;gap:22px;padding:0 18px;
     background:rgba(16,18,26,.62);font:500 15px -apple-system, Inter, sans-serif;transform-origin:0 0">
     <b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
     <span style="margin-left:auto">Fri 20 Mar&nbsp;&nbsp;04:00</span></div>`);
  add('win', `<div class="abs card" style="left:0;top:0;width:640px;transform-origin:0 0">
     <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div>Earth Now</div>
     <img src="${shots}settings-en-dark.png"></div>`);
  add('d1', `<div class="abs display" style="left:0;right:0;top:972px;font-size:66px;text-align:center">It's your wallpaper. Live, all day.</div>`);
  add('d0', `<div class="abs mono" style="left:0;right:0;top:28px;font-size:22px;text-align:center;color:var(--muted)">Lives in the menu bar · set it once, then forget it</div>`);
  [['v1', 'Whole Earth'], ['v2', 'Close-up'], ['v3', 'Horizon']].forEach(([id, name]) =>
    add(id, `<div class="abs cap shadow" style="left:80px;top:900px"><b style="font-size:52px">${name}</b><span class="mono" style="font-size:22px">${CAPS[name]}</span></div>`));
  add('e1', `<div class="abs wordmark shadow" style="left:120px;top:360px;gap:28px"><img src="assets/mark.svg" style="width:118px;height:118px"><span class="display" style="font-size:150px">Earth Now</span></div>`);
  add('e2', `<div class="abs lead shadow" style="left:124px;top:540px;font-size:48px;color:var(--star)">The real Earth, right now,<br>as your Mac's desktop.</div>`);
  add('e3', `<div class="abs mono shadow" style="left:124px;top:690px;font-size:24px;color:var(--muted)">Free and open source · macOS 13 or later · Apple Silicon and Intel</div>`);
}

function landscape(t) {
  const o = (id, v, dy = 0) => { el[id].style.opacity = v; el[id].style.transform = `translateY(${dy}px)`; };
  stage.style.opacity = smooth(t / 0.6);
  o('t1', win(t, 0.4, 1.2, 2.8, 3.4), rise(t, 0.4, 1.3, 22));
  o('r1', win(t, 4.0, 4.8, 9.8, 10.4), rise(t, 4.0, 4.9, 24));
  o('r2', win(t, 4.8, 5.6, 9.8, 10.4), rise(t, 4.8, 5.7, 20));
  el.r1.style.fontWeight = Math.round(300 + 470 * smooth((t - 6.6) / 3.8));
  o('ro', win(t, 0.8, 1.6, 9.8, 10.4));
  o('scr', win(t, 0, 0.1, 2.8, 3.6));
  // desktop: shrink the stage into a display, hold, grow back
  const d = smooth((t - 11.0) / 1.2) * (1 - smooth((t - 18.0) / 1.0));
  const s = 1 - d * (1 - 0.78), top = d * 90, left = (1920 - 1920 * s) / 2;
  stage.style.transform = `translate(${left}px, ${top}px) scale(${s})`;
  stage.style.transformOrigin = '0 0';
  stage.style.borderRadius = `${d * 16}px`;
  stage.style.boxShadow = d > 0 ? `0 0 0 ${d * 12}px #0b0c10, 0 0 0 ${d * 13}px rgba(255,255,255,.12), 0 30px 120px rgba(0,0,0,${d * .8})` : 'none';
  document.body.style.background = d > 0 ? `radial-gradient(80% 70% at 50% 45%, rgb(${22 * d},${28 * d},${44 * d}), #000)` : '#000';
  const mb = el.menubar; mb.style.opacity = smooth((t - 11.9) / 0.5) * (1 - smooth((t - 17.6) / 0.4));
  mb.style.transform = `translate(${left}px, ${top}px) scale(${s})`;
  const w = el.win, wv = win(t, 12.4, 13.0, 17.2, 17.7);
  w.style.opacity = wv;
  w.style.transform = `translate(${left + 120 * s}px, ${top + (90 + rise(t, 12.4, 13.1, 40)) * s}px) scale(${s})`;
  o('d1', win(t, 12.0, 12.6, 17.4, 17.9), rise(t, 12.0, 12.7, 16));
  o('d0', win(t, 12.2, 12.8, 17.4, 17.9));
  o('v1', win(t, 19.9, 20.3, 21.4, 21.8));
  o('v2', win(t, 23.3, 23.7, 24.8, 25.2));
  o('v3', win(t, 26.7, 27.1, 28.2, 28.6));
  o('e1', win(t, 30.2, 30.9, 99, 100), rise(t, 30.2, 31.0, 22));
  o('e2', win(t, 30.6, 31.3, 99, 100), rise(t, 30.6, 31.4, 18));
  o('e3', win(t, 30.9, 31.6, 99, 100), rise(t, 30.9, 31.7, 14));
}

window.setFrame = async ({ t, src, format }) => {
  if (built !== format) { (format === 'story' ? buildStory : buildLandscape)(); built = format;
    await Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); }
  earth.src = src;
  await earth.decode();
  (format === 'story' ? story : landscape)(t);
};
</script>
</body>
</html>
