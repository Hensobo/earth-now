<!doctype html>
<!--
  Stills for the launch: ?scene=story | cover | social. The Earth images are real renders of
  web/index.html (produce.mjs stills -> build/launch/stills). Only the text is added here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Earth Now stills</title>
<link rel="stylesheet" href="brand.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .abs { position: absolute; left: 0; right: 0; text-align: center; }
  .title { font-family: "Inter Display", "Inter", sans-serif; font-weight: 700; letter-spacing: .22em; text-indent: .22em;
    text-shadow: 0 2px 30px rgba(0,0,0,.55); }
  .line { font-family: "Inter Display", "Inter", sans-serif; font-weight: 600; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
  .soft { color: #cfdcef; font-weight: 500; }
  .dot { opacity: .5; padding: 0 .4em; }
  .accent { color: #7cc8ff; }
  /* social share card in the website's hero design */
  .share-scrim { position: absolute; inset: 0; background:
    radial-gradient(110% 95% at 0% 60%, rgba(5,6,13,.86) 0%, rgba(5,6,13,.45) 45%, rgba(5,6,13,0) 70%),
    linear-gradient(0deg, rgba(5,6,13,.75) 0%, rgba(5,6,13,0) 30%); }
  .share { position: absolute; inset: 0; padding: calc(var(--u) * 44) calc(var(--u) * 56) calc(var(--u) * 34); color: var(--star);
    display: grid; grid-template-rows: auto 1fr auto auto; }
  .share-brand { font-size: calc(var(--u) * 26); gap: calc(var(--u) * 12); }
  .share-brand img { width: calc(var(--u) * 36); height: calc(var(--u) * 36); }
  .share-h1 { align-self: end; margin: 0 0 0 -0.05em; font-size: calc(var(--u) * 156); font-weight: 760; }
  .share-lead { margin: calc(var(--u) * 40) 0 0; font-size: calc(var(--u) * 25); line-height: 1.35; color: var(--lead); max-width: 25ch; }
  .share-meta { display: flex; justify-content: space-between; margin-top: calc(var(--u) * 30); padding-top: calc(var(--u) * 14);
    border-top: 1px solid var(--line); font-size: calc(var(--u) * 15.5); color: var(--muted); }
  .share-meta b { color: var(--star); font-weight: 500; }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search), scene = q.get('scene');
document.documentElement.style.setProperty('--u', (innerWidth / 1280) + 'px');
const shareImg = q.get('img');
const img = (n) => `<img class="bg" src="../../build/launch/stills/${n === 'social' && shareImg ? shareImg : n}.png">`;
const html = {
  story: `${img('hero-portrait')}
    <div class="abs title" style="top:285px;font-size:112px">EARTH NOW</div>
    <div class="abs line" style="top:420px;font-size:50px;line-height:1.2">The real Earth, right now,<br>as your Mac's desktop.</div>
    <div class="abs line soft" style="top:1335px;font-size:38px">Real sunlight<span class="dot">·</span>City lights<span class="dot">·</span>Live clouds</div>
    <div class="abs line" style="top:1400px;font-size:40px">Free &amp; Open Source<span class="dot">·</span><span class="accent">macOS 13+</span></div>`,
  cover: `${img('cover-portrait')}
    <div class="abs title" style="top:300px;font-size:104px">EARTH NOW</div>
    <div class="abs line soft" style="top:430px;font-size:42px">Live on your Mac's desktop.</div>`,
  social: `${img('social')}
    <div class="share-scrim"></div>
    <div class="share">
      <div class="brand share-brand"><img src="assets/mark.svg" alt="">Earth Now</div>
      <h1 class="mega share-h1"><span class="ln">The Earth,</span><span class="ln">right now.</span></h1>
      <p class="text share-lead">A live wallpaper for your Mac. Daylight where the sun is up, glowing cities where it's night.</p>
      <div class="mono share-meta"><span><span class="live-dot"></span>Sun overhead at <b>0.2° S, 136.9° E</b></span><span>Free and open source · macOS 13 or later</span></div>
    </div>`,
}[scene];
document.body.insertAdjacentHTML('beforeend', html);
</script>
</body>
</html>
