<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Now</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #iss-label {
    position: fixed; left: 0; top: 0; color: rgba(255,232,190,.9); pointer-events: none; display: none;
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .08em;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); white-space: nowrap;
  }
  #hud {
    position: fixed; left: 32px; bottom: 28px; color: rgba(255,255,255,.55);
    font: 500 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .02em;
    pointer-events: none; display: none;
  }
</style>
</head>
<body>
<div id="hud"></div>
<div id="iss-label">ISS</div>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import { bodyState, BODIES, rotationDegPerDay } from './planets.js';
import { ISS } from './iss.js';

// ---------------------------------------------------------------------------
// Konfiguration. Die macOS-App setzt window.__initialConfig und ruft bei
// Änderungen window.applyConfig({...}) auf. Im Browser gehen URL-Parameter,
// z. B. index.html?motion=fixed&lat=52.5&lon=13.4&zoom=2.4&pitch=30
//
//   body     earth | moon | mercury | venus | mars | jupiter | saturn | uranus | neptune
//   motion   orbit | fixed | sun | earth   Umkreisen / steht über dem Ort / folgt der Sonne /
//            so, wie man den Körper gerade von der Erde aus sieht (echte Phase; nicht für body=earth)
//   speed    Umlaufgeschwindigkeit im orbit-Modus, Grad pro Sekunde
//   lat,lon  Ort, über dem die Kamera steht
//   zoom     Erdradius relativ zur halben Bildschirmhöhe (bei pitch 0)
//   pitch    Kameraneigung: 0 = senkrecht auf den Ort, 70+ = Blick zum Horizont
//   heading  Blickrichtung bei geneigter Kamera (0 = Norden)
//   tilt     Drehung des Bildes in Grad
//   fov      Brennweite (vertikaler Blickwinkel)
//   x,y      Verschiebung des Bildausschnitts (-1..1)
//   fps, hud (0/1), clouds (live|static|off), warp (Zeitraffer-Faktor)
//   fx       Polarlichter & Sturm-Animationen (0/1); kp=0..9 legt die Polarlicht-Aktivität fest (Tests)
//   iss      ISS mit Live-Position einblenden (0/1), issPath: ihre Flugbahn (0/1)
//            motion=iss-chase: Kamera fliegt hinter der ISS her, Horizont voraus
//            motion=iss-above: Kamera schwebt über der ISS und folgt ihr
//   time     Startzeitpunkt statt jetzt, ISO 8601, z. B. time=2026-06-21T18:00:00Z (für Tests/Screenshots)
// ---------------------------------------------------------------------------
const P = new URLSearchParams(location.search);
const cfg = {
  body: 'earth', motion: 'orbit', speed: 0.4, lat: 28, lon: 10, place: '',
  zoom: 0.62, pitch: 0, heading: 0, tilt: 18, fov: 30, x: 0, y: 0,
  fps: 30, hud: false, clouds: 'live', warp: 1, fx: true, iss: true, issPath: true,
  ...(window.__initialConfig || {}),
};
for (const [k, v] of P) {
  if (!(k in cfg)) continue;
  cfg[k] = typeof cfg[k] === 'number' ? +v : typeof cfg[k] === 'boolean' ? v === '1' : v;
}

const DEG = Math.PI / 180;
const startReal = Date.now();
const startSim = Date.parse(P.get('time') || window.__startTime || '') || startReal;
const now = () => new Date(startSim + (Date.now() - startReal) * cfg.warp);

// --- Sonnenstand (Subsolarpunkt) -------------------------------------------
// Low-precision-Formeln des Astronomical Almanac, Genauigkeit ~0.01°.
function subsolarPoint(date) {
  const d = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const g = (357.529 + 0.98560028 * d) * DEG;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * DEG;
  const e = (23.439 - 0.00000036 * d) * DEG;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / DEG;
  const dec = Math.asin(Math.sin(e) * Math.sin(L)) / DEG;
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
  let lon = ra - gmst * 15;
  lon = ((lon + 540) % 360) - 180;
  return { lat: dec, lon };
}

// Geografische Koordinaten -> Richtungsvektor im Erd-Koordinatensystem
// (passend zur UV-Abwicklung von THREE.SphereGeometry).
function latLonToVec(lat, lon, out = new THREE.Vector3()) {
  const la = lat * DEG, lo = lon * DEG;
  return out.set(Math.cos(la) * Math.cos(lo), Math.sin(la), -Math.cos(la) * Math.sin(lo));
}

// --- Renderer / Szene --------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
// 1.5-fache Auflösung reicht für die weichen Erdtexturen und spart ~45 % GPU-Arbeit.
// Im „Flüssig“-Modus (60 fps) volle Retina-Auflösung.
const applyPixelRatio = () => renderer.setPixelRatio(Math.min(window.devicePixelRatio, cfg.fps >= 60 ? 2 : 1.5));
applyPixelRatio();
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 1000);

const loader = new THREE.TextureLoader();
// Sobald eine Textur fertig geladen ist, neu zeichnen (sonst bei niedriger Bildrate erst Sekunden später)
THREE.DefaultLoadingManager.onProgress = () => requestRender();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(url, srgb = true) {
  const t = loader.load(url);
  t.anisotropy = maxAniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const dayTex = tex('textures/day.jpg');
const nightTex = tex('textures/night.jpg');
const specTex = tex('textures/specular.jpg', false);
const normalTex = tex('textures/normal.jpg', false);
let cloudTex = null;  // statische Wolken, erst bei Bedarf geladen
function staticClouds() {
  if (!cloudTex) { cloudTex = tex('textures/clouds.png', false); cloudTex.wrapS = THREE.RepeatWrapping; }
  return cloudTex;
}
const emptyTex = new THREE.DataTexture(new Uint8Array(4), 1, 1);
emptyTex.needsUpdate = true;

const sunDir = new THREE.Vector3(1, 0, 0);

// --- Erde --------------------------------------------------------------------
const earthMat = new THREE.ShaderMaterial({
  uniforms: {
    dayMap: { value: dayTex },
    nightMap: { value: nightTex },
    specMap: { value: specTex },
    normalMap: { value: normalTex },
    cloudMap: { value: emptyTex },
    cloudAmt: { value: 1 },
    sunDir: { value: sunDir },
    camPos: { value: camera.position },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPos;
    void main() {
      vUv = uv;
      vNormal = normalize(normal);
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D dayMap, nightMap, specMap, normalMap, cloudMap;
    uniform vec3 sunDir, camPos;
    uniform float cloudAmt;
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPos;

    void main() {
      vec3 N = normalize(vNormal);
      // Leichtes Relief über die Normal-Map (Tangentenraum auf der Kugel)
      vec3 T = normalize(vec3(-N.z, 0.0, N.x) + 1e-5);
      vec3 B = cross(N, T);
      vec3 nm = texture2D(normalMap, vUv).xyz * 2.0 - 1.0;
      vec3 Nb = normalize(N + 0.35 * (nm.x * T + nm.y * B));

      vec3 V = normalize(camPos - vPos);
      float sunN = dot(N, sunDir);
      float lit = dot(Nb, sunDir);

      // Tag/Nacht-Übergang mit weicher Dämmerungszone
      float dayAmt = smoothstep(-0.06, 0.14, sunN);
      float twilight = smoothstep(-0.18, 0.0, sunN) * (1.0 - smoothstep(0.0, 0.22, sunN));

      vec3 day = pow(texture2D(dayMap, vUv).rgb, vec3(1.12)) * 0.92;
      vec3 night = texture2D(nightMap, vUv).rgb;
      float ocean = texture2D(specMap, vUv).r;

      // Wolkenschatten: Wolkentextur leicht Richtung Sonne versetzt
      float cloud = texture2D(cloudMap, vUv).a * cloudAmt;
      float shadow = texture2D(cloudMap, vUv + vec2(sunDir.x, sunDir.y) * 0.0015).a * cloudAmt;

      vec3 color = day * (0.04 + 0.95 * max(lit, 0.0)) * (1.0 - 0.35 * shadow);

      // Spiegelung der Sonne auf den Ozeanen
      vec3 H = normalize(sunDir + V);
      float spec = pow(max(dot(N, H), 0.0), 60.0) * ocean * (1.0 - cloud);
      color += vec3(1.0, 0.92, 0.78) * spec * 0.55 * dayAmt;

      // Dämmerungsfärbung
      color = mix(color, color * vec3(1.25, 0.75, 0.5) + vec3(0.06, 0.02, 0.0), twilight * 0.6);

      // Nachtseite: Stadtlichter, unter Wolken gedämpft
      // Black Marble enthält schwach sichtbares Gelände -> nur echte Lichter durchlassen
      float nl = dot(night, vec3(0.3, 0.5, 0.2));
      vec3 lights = night * smoothstep(0.12, 0.45, nl) * vec3(1.0, 0.8, 0.5) * 2.2 * (1.0 - 0.75 * cloud);
      color = mix(color, day * 0.012, 1.0 - dayAmt);
      color += lights * (1.0 - dayAmt);

      // Atmosphärischer Dunst am Rand (nur auf der beleuchteten Seite)
      float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
      color += vec3(0.30, 0.55, 1.0) * fres * 0.6 * smoothstep(-0.05, 0.4, sunN);

      gl_FragColor = vec4(color, 1.0);
      #include <colorspace_fragment>
    }`,
});

const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), earthMat);
scene.add(earth);

// --- Wolken ------------------------------------------------------------------
const cloudMat = new THREE.ShaderMaterial({
  uniforms: { cloudMap: { value: emptyTex }, sunDir: { value: sunDir }, drift: { value: 0 } },
  transparent: true,
  depthWrite: false,
  vertexShader: /* glsl */`
    varying vec2 vUv; varying vec3 vNormal;
    void main() {
      vUv = uv; vNormal = normalize(normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D cloudMap; uniform vec3 sunDir; uniform float drift;
    varying vec2 vUv; varying vec3 vNormal;
    void main() {
      float a = texture2D(cloudMap, vUv + vec2(drift, 0.0)).a;
      float sunN = dot(normalize(vNormal), sunDir);
      float light = smoothstep(-0.12, 0.25, sunN);
      vec3 col = mix(vec3(0.02, 0.025, 0.04), vec3(1.0), light);
      // Wolken an der Terminatorlinie warm anleuchten
      float tw = smoothstep(-0.12, 0.02, sunN) * (1.0 - smoothstep(0.02, 0.2, sunN));
      col = mix(col, vec3(1.0, 0.62, 0.38), tw * 0.7);
      gl_FragColor = vec4(col, a * mix(0.25, 0.95, light));
      #include <colorspace_fragment>
    }`,
});
const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.006, 256, 128), cloudMat);
scene.add(clouds);

// Live-Wolkenbild (alle ~3 h aktualisiert, Quelle: github.com/matteason/live-cloud-maps).
// 8K nur für nahe Ansichten – spart sonst ~200 MB Grafikspeicher.
const liveCloudsUrl = (res) => `https://clouds.matteason.co.uk/images/${res}/clouds-alpha.png`;
const wantedCloudRes = () => (cfg.zoom > 1.5 || String(cfg.motion).startsWith('iss') ? '8192x4096' : '4096x2048');
let liveCloudTex = null, liveCloudRes = null, liveCloudLoading = false;
function setCloudTex(t) {
  cloudMat.uniforms.cloudMap.value = t;
  earthMat.uniforms.cloudMap.value = t;
  requestRender();
}
// Nach einem Fehlschlag (offline, Server nicht erreichbar) statische Wolken zeigen und
// erst nach einer Wartezeit erneut versuchen: 1, 2, 4 … höchstens 60 Minuten.
let liveCloudRetryAt = 0, liveCloudFailures = 0;
function loadLiveClouds() {
  if (cfg.clouds !== 'live' || liveCloudLoading || Date.now() < liveCloudRetryAt) return;
  if ((BODIES[cfg.body] ? cfg.body : 'earth') !== 'earth') return;  // Wolken gibt es nur auf der Erde
  const res = wantedCloudRes();
  liveCloudLoading = true;
  loader.setCrossOrigin('anonymous');
  // Die Karten werden alle 3 h aktualisiert: gleicher Parameter innerhalb von 3 h,
  // damit der stündliche Check aus dem Browser-Cache kommt und den Server nicht belastet.
  loader.load(`${liveCloudsUrl(res)}?t=${Math.floor(Date.now() / 1.08e7)}`, (t) => {
    liveCloudLoading = false;
    liveCloudFailures = 0;
    liveCloudRetryAt = 0;
    t.anisotropy = maxAniso;
    t.wrapS = THREE.RepeatWrapping;
    liveCloudTex?.dispose();
    liveCloudTex = t;
    liveCloudRes = res;
    applyCloudMode();
  }, undefined, () => {
    liveCloudLoading = false;
    liveCloudFailures++;
    liveCloudRetryAt = Date.now() + Math.min(60, 2 ** (liveCloudFailures - 1)) * 60 * 1000;
    applyCloudMode();  // zeigt statische Wolken; neuer Versuch erst nach liveCloudRetryAt
  });
}
function applyCloudMode() {
  clouds.visible = cfg.clouds !== 'off';
  earthMat.uniforms.cloudAmt.value = cfg.clouds === 'off' ? 0 : 1;
  if (cfg.clouds === 'live' && (!liveCloudTex || liveCloudRes !== wantedCloudRes())) loadLiveClouds();
  if (cfg.clouds === 'off') setCloudTex(emptyTex);
  else setCloudTex(cfg.clouds === 'live' && liveCloudTex ? liveCloudTex : staticClouds());
}
const liveCloudsActive = () => cfg.clouds === 'live' && !!liveCloudTex;
setInterval(loadLiveClouds, 60 * 60 * 1000);

// --- Atmosphäre (Glow um die Erde) ---------------------------------------
const ATMO = 1.03;
const atmoMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: sunDir }, camPos: { value: camera.position } },
  side: THREE.BackSide,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 sunDir, camPos;
    varying vec3 vPos;
    void main() {
      // Tiefster Punkt des Sichtstrahls über der Erdoberfläche
      vec3 D = normalize(vPos - camPos);
      float t = max(-dot(camPos, D), 0.0);
      vec3 closest = camPos + D * t;
      float h = (length(closest) - 1.0) / ${(ATMO - 1).toFixed(3)};
      float glow = pow(clamp(1.0 - h, 0.0, 1.0), 3.0);
      // Kamera innerhalb der Lufthülle: Strahlen nach oben (t = 0) leuchten nicht
      glow *= smoothstep(0.0, 0.08, t);
      float sunN = dot(normalize(closest), sunDir);
      float lit = smoothstep(-0.2, 0.25, sunN);
      vec3 col = mix(vec3(1.0, 0.42, 0.18), vec3(0.32, 0.6, 1.0), smoothstep(-0.06, 0.18, sunN));
      gl_FragColor = vec4(col * glow * lit * 1.5, 1.0);
      #include <colorspace_fragment>
    }`,
});
const atmo = new THREE.Mesh(new THREE.SphereGeometry(ATMO, 160, 80), atmoMat);
scene.add(atmo);

// --- Planeten & Mond -----------------------------------------------------------
// Ein gemeinsamer Shader für alle anderen Körper: Textur, echte Beleuchtung (Sonne aus
// planets.js), weiche Randverdunkelung, Dunst am Rand, bei Saturn Ringe mit Schatten.
const planetMat = new THREE.ShaderMaterial({
  uniforms: {
    map: { value: emptyTex }, sunDir: { value: sunDir }, camPos: { value: camera.position },
    ambient: { value: new THREE.Color(0, 0, 0) }, rough: { value: 0.7 },
    haloColor: { value: new THREE.Color(0, 0, 0) }, haloAmt: { value: 0 },
    ringMap: { value: emptyTex }, ringInner: { value: 0 }, ringOuter: { value: 0 },
    flowAmt: { value: 0 }, flowTime: { value: 0 }, vortex: { value: new THREE.Vector3(0, 0, 0.001) },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv; varying vec3 vNormal; varying vec3 vPos;
    void main() {
      vUv = uv; vNormal = normalize(normal); vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D map, ringMap;
    uniform vec3 sunDir, camPos, ambient, haloColor;
    uniform float rough, haloAmt, ringInner, ringOuter;
    uniform float flowAmt, flowTime;
    uniform vec3 vortex;  // u, v, radius (uv units) – e.g. Jupiter's Great Red Spot
    varying vec2 vUv; varying vec3 vNormal; varying vec3 vPos;

    // Gasplaneten: Wolkenbänder strömen gegeneinander, ein Wirbel dreht sich.
    // Zwei zeitversetzte Phasen werden überblendet, damit sich nichts aufschaukelt.
    vec3 albedoAt(vec2 uv) {
      if (flowAmt <= 0.0) return texture2D(map, uv).rgb;
      float lat = (uv.y - 0.5) * 3.14159265;
      vec2 flow = vec2((sin(lat * 13.0) * 0.65 + sin(lat * 6.0 + 1.3) * 0.35) * 0.0035, 0.0);
      vec2 d = (uv - vortex.xy) * vec2(2.0, 1.0);
      float w = exp(-dot(d, d) / (vortex.z * vortex.z));
      flow += vec2(d.y, -d.x * 0.5) * w * 0.35;
      flow *= flowAmt;
      float p0 = fract(flowTime), p1 = fract(flowTime + 0.5);
      vec3 a = texture2D(map, uv + flow * (p0 - 0.5)).rgb;
      vec3 b = texture2D(map, uv + flow * (p1 - 0.5)).rgb;
      return mix(a, b, abs(p0 - 0.5) * 2.0);
    }

    void main() {
      vec3 N = normalize(vNormal);
      vec3 V = normalize(camPos - vPos);
      float mu0 = dot(N, sunDir), mu = max(dot(N, V), 0.0);
      // Minnaert-Beleuchtung: rough ~0.5 = Mondgestein (hell bis zum Rand), ~0.9 = Wolkenplanet
      float light = mu0 > 0.0 ? pow(mu0, rough) * pow(max(mu, 0.05), rough - 1.0) : 0.0;
      light = min(light * smoothstep(-0.02, 0.06, mu0) * 1.08, 1.4);
      // Schatten der Saturnringe auf dem Planeten
      if (ringOuter > 0.0 && abs(sunDir.y) > 1e-4) {
        float t = -vPos.y / sunDir.y;
        if (t > 0.0) {
          float r = length((vPos + sunDir * t).xz);
          if (r > ringInner && r < ringOuter)
            light *= 1.0 - 0.8 * texture2D(ringMap, vec2((r - ringInner) / (ringOuter - ringInner), 0.5)).a;
        }
      }
      vec3 albedo = albedoAt(vUv);
      vec3 color = albedo * (light + ambient * 2.5 * (1.0 - smoothstep(0.0, 0.2, mu0)));
      // Dunst am Rand der Tagseite
      float fres = pow(1.0 - mu, 3.0);
      color += haloColor * fres * haloAmt * 0.6 * smoothstep(-0.1, 0.35, mu0);
      gl_FragColor = vec4(color, 1.0);
      #include <colorspace_fragment>
    }`,
});
const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), planetMat);

// Leuchtsaum außerhalb des Planetenrands (dünne Atmosphäre: Mars, Venus, Gasplaneten)
const haloMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: sunDir }, camPos: { value: camera.position },
              color: { value: new THREE.Color(0, 0, 0) }, amount: { value: 0 } },
  side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: atmoMat.vertexShader,
  fragmentShader: /* glsl */`
    uniform vec3 sunDir, camPos, color; uniform float amount;
    varying vec3 vPos;
    void main() {
      vec3 D = normalize(vPos - camPos);
      float t = max(-dot(camPos, D), 0.0);
      vec3 closest = camPos + D * t;
      float h = (length(closest) - 1.0) / 0.025;
      float glow = pow(clamp(1.0 - h, 0.0, 1.0), 2.5) * smoothstep(0.0, 0.08, t);
      float lit = smoothstep(-0.15, 0.3, dot(normalize(closest), sunDir));
      gl_FragColor = vec4(color * glow * lit * amount, 1.0);
      #include <colorspace_fragment>
    }`,
});
const halo = new THREE.Mesh(new THREE.SphereGeometry(1.025, 128, 64), haloMat);

// Saturnringe: flach in der Äquatorebene (y = 0), beidseitig, mit Planetenschatten
const ringMat = new THREE.ShaderMaterial({
  uniforms: { ringMap: { value: emptyTex }, sunDir: { value: sunDir }, camPos: { value: camera.position },
              ringInner: { value: 1.22 }, ringOuter: { value: 2.32 } },
  side: THREE.DoubleSide, transparent: true, depthWrite: false,
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D ringMap; uniform vec3 sunDir, camPos; uniform float ringInner, ringOuter;
    varying vec3 vPos;
    void main() {
      float r = length(vPos.xz);
      vec4 tx = texture2D(ringMap, vec2((r - ringInner) / (ringOuter - ringInner), 0.5));
      // Schatten des Planeten auf den Ringen
      float b = dot(vPos, sunDir), c = dot(vPos, vPos) - 1.0, disc = b * b - c;
      float shadow = (disc > 0.0 && -b - sqrt(disc) > 0.0) ? 0.04 : 1.0;
      // Von der unbeleuchteten Seite gesehen scheint nur Licht durch die Ringe
      bool sameSide = sign(camPos.y) == sign(sunDir.y);
      float lit = sameSide ? 0.25 + 0.95 * abs(sunDir.y) / (abs(sunDir.y) + 0.05) : 0.35 * (1.0 - 0.6 * tx.a);
      gl_FragColor = vec4(tx.rgb * lit * shadow, tx.a);
      #include <colorspace_fragment>
    }`,
});
const ringGeo = new THREE.RingGeometry(1.22, 2.32, 256, 1);
ringGeo.rotateX(-Math.PI / 2);
const ring = new THREE.Mesh(ringGeo, ringMat);

// --- Polarlichter -------------------------------------------------------------
// Leuchtende Ovale um die magnetischen Pole: auf der Erde grün mit rotem Saum, nur auf der
// Nachtseite; auf Jupiter und Saturn (dort im UV) bläulich wie auf Hubble-Bildern.
const auroraMat = new THREE.ShaderMaterial({
  uniforms: {
    sunDir: { value: sunDir }, camPos: { value: camera.position }, time: { value: 0 },
    poleN: { value: new THREE.Vector3(0, 1, 0) }, poleS: { value: new THREE.Vector3(0, -1, 0) },
    colat: { value: 0.4 }, width: { value: 0.06 }, strength: { value: 0 },
    colorLow: { value: new THREE.Color(0.15, 1.0, 0.45) }, colorHigh: { value: new THREE.Color(0.9, 0.2, 0.45) },
    nightOnly: { value: 1 }, rayAmt: { value: 0.55 }, layer: { value: 0 },
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 sunDir, camPos, poleN, poleS, colorLow, colorHigh;
    uniform float time, colat, width, strength, nightOnly, rayAmt, layer;

  applyISS();
  updateCamera(Math.min(dt, 2), st);
  auroraLayers.forEach((l) => { l.material.uniforms.time.value = sec; });
  planetMat.uniforms.flowTime.value = sec / 24;  // eine Strömungsphase dauert 24 s
  // Statische Wolken driften leicht, Live-Wolken bleiben geografisch korrekt
  cloudMat.uniforms.drift.value = liveCloudsActive() ? 0 : sec * 0.0002;

  if (cfg.hud) {
    const de = navigator.language.startsWith('de');
    const body = shownBody === 'earth' ? '' : BODIES[shownBody].name[de ? 'de' : 'en'] + '  ·  ';
    const dist = st.earthDistance
      ? `  ·  ${st.earthDistance < 0.02 ? Math.round(st.earthDistance * 149597871).toLocaleString(de ? 'de-DE' : 'en-GB') + ' km'
                                        : st.earthDistance.toFixed(2).replace('.', de ? ',' : '.') + (de ? ' AE' : ' AU')}${de ? ' von der Erde' : ' from Earth'}`
      : '';
    if (issMode()) {
      hud.textContent = `ISS  ·  ${Math.round(iss.alt)} km  ·  ${Math.round(iss.speed).toLocaleString(de ? 'de-DE' : 'en-GB')} km/h  ·  ` +
        (de ? 'über ' : 'over ') + `${fmtCoord(iss.lat, 'N', 'S')}, ${fmtCoord(iss.lon, de ? 'O' : 'E', 'W')}` +
        (iss.inShadow ? (de ? '  ·  im Erdschatten' : '  ·  in Earth\'s shadow') : '') +
        (iss.live ? '' : (de ? '  ·  Bahndaten offline' : '  ·  offline orbit data'));
    } else
    hud.textContent = body + (cfg.place ? cfg.place + '  ·  ' : '') +
      date.toLocaleString(de ? 'de-DE' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' }) +
      (de ? `  ·  Sonne im Zenit über ${fmtCoord(sun.lat, 'N', 'S')}, ${fmtCoord(sun.lon, 'O', 'W')}`
          : `  ·  Sun overhead at ${fmtCoord(sun.lat, 'N', 'S')}, ${fmtCoord(sun.lon, 'E', 'W')}`) +
      dist + (liveCloudsActive() ? (de ? '  ·  Wolken live' : '  ·  Live clouds') : '') +
      (shownBody === 'earth' && cfg.fx && kpLive ? `  ·  ${de ? 'Polarlicht-Aktivität' : 'Aurora activity'} Kp ${kp.toFixed(1)}` : '') +
      (shownBody === 'earth' && cfg.iss ? (updateNextPass(date), passText(date, de)) : '');
  }
  renderer.render(scene, camera);
  if (issMode()) {
    iss.camera.near = issScale > 1 ? 50 : 0.5; iss.camera.far = issScale > 1 ? 1e5 : 2e4; iss.camera.updateProjectionMatrix();
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(iss.scene, iss.camera);
    renderer.autoClear = true;
  }
  placeIssLabel();

  const fps = desiredFps();
  const next = Math.max(0, 1000 / fps - (performance.now() - sec * 1000) - 4);
  lastRender = sec;
  schedule(fps >= cfg.fps ? 0 : next);
}

applyBody();
requestRender();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  requestRender();
});
</script>
</body>
</html>
