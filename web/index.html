<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Now</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #iss-label {
    position: fixed; left: 0; top: 0; color: rgba(255,232,190,.9); pointer-events: none; display: none;
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .08em;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); white-space: nowrap;
  }
  #hud {
    position: fixed; left: 32px; bottom: 28px; color: rgba(255,255,255,.55);
    font: 500 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .02em;
    pointer-events: none; display: none;
  }
</style>
</head>
<body>
<div id="hud"></div>
<div id="iss-label">ISS</div>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import { bodyState, BODIES, rotationDegPerDay, moonFromEarth, subsolarOfDate } from './planets.js';
import { ISS } from './iss.js';

// ---------------------------------------------------------------------------
// Konfiguration. Die macOS-App setzt window.__initialConfig und ruft bei
// Änderungen window.applyConfig({...}) auf. Im Browser gehen URL-Parameter,
// z. B. index.html?motion=fixed&lat=52.5&lon=13.4&zoom=2.4&pitch=30
//
//   body     sun | earth | moon | mercury | venus | mars | jupiter | saturn | uranus | neptune
//   motion   orbit | fixed | sun | earth   Umkreisen / steht über dem Ort / folgt der Sonne /
//            so, wie man den Körper gerade von der Erde aus sieht (echte Phase; nicht für body=earth)
//   speed    Umlaufgeschwindigkeit im orbit-Modus, Grad pro Sekunde
//   lat,lon  Ort, über dem die Kamera steht
//   zoom     Erdradius relativ zur halben Bildschirmhöhe (bei pitch 0)
//   pitch    Kameraneigung: 0 = senkrecht auf den Ort, 70+ = Blick zum Horizont
//   heading  Blickrichtung bei geneigter Kamera (0 = Norden)
//   tilt     Drehung des Bildes in Grad
//   fov      Brennweite (vertikaler Blickwinkel)
//   x,y      Verschiebung des Bildausschnitts (-1..1)
//   fps, hud (0/1), clouds (live|static|off), warp (Zeitraffer-Faktor)
//   fx       Polarlichter & Sturm-Animationen (0/1); kp=0..9 legt die Polarlicht-Aktivität fest (Tests)
//   aurora3d Erde: Polarlichter als 3D-Vorhänge (1, mehr GPU) statt flach (0, sparsam)
//   detail   standard | high | ultra: high = Nachtlichter und Wolken in 8K; ultra = dazu volle
//            NASA-Auflösung rund um den Blickpunkt (Kacheln aus ultraBase, z. B. ultraBase=ultra/)
//   iss      ISS mit Live-Position einblenden (0/1), issPath: ihre Flugbahn (0/1)
//            motion=iss-chase: Kamera fliegt hinter der ISS her, Horizont voraus
//            motion=iss-above: Kamera schwebt über der ISS und folgt ihr
//            motion=earth-moon: Erde und Mond zusammen, aus großer Entfernung (echte Größen und Abstände)
//   time     Startzeitpunkt statt jetzt, ISO 8601, z. B. time=2026-06-21T18:00:00Z (für Tests/Screenshots)
// ---------------------------------------------------------------------------
const P = new URLSearchParams(location.search);
const cfg = {
  body: 'earth', motion: 'orbit', speed: 0.4, lat: 28, lon: 10, place: '',
  zoom: 0.62, pitch: 0, heading: 0, tilt: 18, fov: 30, x: 0, y: 0,
  fps: 30, hud: false, clouds: 'live', warp: 1, fx: true, aurora3d: false, detail: 'standard', ultraBase: '', iss: true, issPath: true,
  ...(window.__initialConfig || {}),
};
for (const [k, v] of P) {
  if (!(k in cfg)) continue;
  cfg[k] = typeof cfg[k] === 'number' ? +v : typeof cfg[k] === 'boolean' ? v === '1' : v;
}

const DEG = Math.PI / 180;
const startReal = Date.now();
const startSim = Date.parse(P.get('time') || window.__startTime || '') || startReal;
const now = () => capture ? new Date(capture.time) : new Date(startSim + (Date.now() - startReal) * cfg.warp);
// Capture-only hook for the launch videos (design/launch/capture.mjs). Only active with ?capture=1;
// the app never sets it. Then nothing renders on its own: each frame is drawn by __captureFrame
// with an exact simulation time and an exact camera (no smoothing).
let capture = null;
window.__captureFrame = P.has('capture') ? (time, sec, view) => {
  capture = { time, sec };
  Object.assign(cfg, view);
  Object.assign(cam, view);
  frame();
} : undefined;

// --- Sonnenstand (Subsolarpunkt): planets.js, Genauigkeit ~0.01° ---
const subsolarPoint = subsolarOfDate;

// Geografische Koordinaten -> Richtungsvektor im Erd-Koordinatensystem
// (passend zur UV-Abwicklung von THREE.SphereGeometry).
function latLonToVec(lat, lon, out = new THREE.Vector3()) {
  const la = lat * DEG, lo = lon * DEG;
  return out.set(Math.cos(la) * Math.cos(lo), Math.sin(la), -Math.cos(la) * Math.sin(lo));
}

// --- Renderer / Szene --------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' });
// 1.5-fache Auflösung reicht für die weichen Erdtexturen und spart ~45 % GPU-Arbeit.
// Im „Flüssig“-Modus (60 fps) volle Retina-Auflösung.
const applyPixelRatio = () => renderer.setPixelRatio(Math.min(window.devicePixelRatio, cfg.fps >= 60 ? 2 : 1.5));
applyPixelRatio();
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 1000);

const loader = new THREE.TextureLoader();
// Sobald eine Textur fertig geladen ist, neu zeichnen (sonst bei niedriger Bildrate erst Sekunden später)
THREE.DefaultLoadingManager.onProgress = () => requestRender();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(url, srgb = true) {
  const t = loader.load(url);
  t.anisotropy = maxAniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Capture-only (launch videos, ?capture=1&detail=<folder>): higher-resolution NASA textures from
// design/launch/textures: whole-globe night lights and clouds at 8K, plus full-resolution crops
// over Europe that are blended in. The app never sets this; its shaders stay as they are.
const DETAIL = P.has('capture') && P.get('detail') ? P.get('detail') : '';
const DETAIL_RECT = [-32, 22, 48, 74];   // lon0, lat0, lon1, lat1 of the *-europe.jpg crops

const dayTex = tex('textures/day.jpg');
const nightFile = () => DETAIL ? DETAIL + 'night-8k.jpg' : cfg.detail !== 'standard' ? 'textures/night-8k.jpg' : 'textures/night.jpg';
let nightTex = tex(nightFile()), nightFileLoaded = nightFile();
const specTex = tex('textures/specular.jpg', false);
const normalTex = tex('textures/normal.jpg', false);
// Statische Wolken, erst bei Bedarf geladen: 2K mit Deckung im Alphakanal, oder (Detail „Hoch“)
// 8K als Graustufen-JPEG (Deckung im Grauwert)
const staticCloudTex = {};
function staticClouds() {
  const grey = !!DETAIL || cfg.detail !== 'standard';
  const file = DETAIL ? DETAIL + 'clouds-8k.jpg' : grey ? 'textures/clouds-8k.jpg' : 'textures/clouds.png';
  if (!staticCloudTex[file]) {
    const t = tex(file, false); t.wrapS = THREE.RepeatWrapping; t.userData.grey = grey;
    staticCloudTex[file] = t;
  }
  return staticCloudTex[file];
}
// Detailstufe gewechselt: Nachtlichter tauschen (die Wolken folgen über applyCloudMode)
function applyDetail() {
  if (nightFile() === nightFileLoaded) return;
  const old = nightTex;
  nightTex = tex(nightFile()); nightFileLoaded = nightFile();
  earthMat.uniforms.nightMap.value = nightTex;
  old.dispose();
  for (const [f, t] of Object.entries(staticCloudTex)) if (t !== staticClouds()) { t.dispose(); delete staticCloudTex[f]; }
}
// Detailkarten, die über die Weltkarte geblendet werden (Mitte und Spannweite in Grad):
//  – Aufnahmen (?capture=1&detail=…): feste Ausschnitte über Europa (Tag, Nacht, Wolken)
//  – Texturdetail „Ultra“: Kacheln in voller NASA-Auflösung rund um den Blickpunkt (siehe Ultra unten)
// Ohne beides wird der Code gar nicht erst kompiliert (USE_DETAIL).
const detailUniforms = {
  dayDetail: { value: DETAIL ? tex(DETAIL + 'day-europe.jpg') : null },
  nightDetail: { value: DETAIL ? tex(DETAIL + 'night-europe.jpg') : null },
  cloudDetail: { value: DETAIL ? tex(DETAIL + 'clouds-europe.jpg', false) : null },
  detailRect: { value: new THREE.Vector4((DETAIL_RECT[0] + DETAIL_RECT[2]) / 2, (DETAIL_RECT[1] + DETAIL_RECT[3]) / 2,
                                         DETAIL_RECT[2] - DETAIL_RECT[0], DETAIL_RECT[3] - DETAIL_RECT[1]) },
  detailAmt: { value: DETAIL ? 1 : 0 },
  cloudDetailOn: { value: DETAIL ? 1 : 0 },
};
const DETAIL_GLSL = `
    uniform float cloudGrey;   // 1: Deckung im Grauwert (8K-JPEG), 0: im Alphakanal
    #ifdef USE_DETAIL
    uniform sampler2D dayDetail, nightDetail, cloudDetail; uniform vec4 detailRect; uniform float detailAmt, cloudDetailOn;
    // Position in der Detailkarte (xy) und Gewicht (z), das zum Rand hin ausblendet
    vec3 detailAt(vec2 uv) {
      float lon = uv.x * 360.0 - 180.0, lat = uv.y * 180.0 - 90.0;
      vec2 d = vec2((mod(lon - detailRect.x + 540.0, 360.0) - 180.0) / detailRect.z, (lat - detailRect.y) / detailRect.w) + 0.5;
      float w = smoothstep(0.0, 0.06, d.x) * smoothstep(0.0, 0.06, 1.0 - d.x) * smoothstep(0.0, 0.06, d.y) * smoothstep(0.0, 0.06, 1.0 - d.y);
      return vec3(clamp(d, 0.0, 1.0), w * detailAmt);
    }
    #endif
    float cloudAt(sampler2D base, vec2 uv) {
      vec4 t = texture2D(base, uv);
      float c = cloudGrey > 0.5 ? t.r : t.a;
      #ifdef USE_DETAIL
      if (cloudDetailOn > 0.5) { vec3 dt = detailAt(uv); c = mix(c, texture2D(cloudDetail, dt.xy).r, dt.z); }
      #endif
      return c;
    }`;

// --- Ultra: volle NASA-Auflösung rund um den Blickpunkt --------------------------------------
// Das Paket (von der App geladen, siehe design/ultra) enthält Kacheln von 10°×10°:
// day/<Spalte>_<Zeile>.jpg (600 px, 60 px/°) und night/… (375 px), Spalte 0 ab 180° W, Zeile 0 ab 90° N.
// Bei nahen Ansichten werden 8×8 Kacheln (80°×80°) um den Blickpunkt zu einer Detailkarte
// zusammengesetzt und weich über die 8K-Weltkarte geblendet; weit weg genügt die Weltkarte.
const ULTRA_SPAN = 80, ULTRA_TILES = ULTRA_SPAN / 10;
const ultra = { center: null, loading: false, dayTex: null, nightTex: null, failed: 0 };
const ultraActive = () => !DETAIL && cfg.detail === 'ultra' && !!cfg.ultraBase;
function setDetailDefine(on) {
  for (const m of [earthMat, cloudMat]) {
    const has = 'USE_DETAIL' in m.defines;
    if (on && !has) { m.defines.USE_DETAIL = ''; m.needsUpdate = true; }
    if (!on && has) { delete m.defines.USE_DETAIL; m.needsUpdate = true; }
  }
}
// Punkt auf der Erde in Bildmitte (oder unter der Kamera, falls die Bildmitte am Himmel liegt)
const _vd = new THREE.Vector3(), _vp = new THREE.Vector3();
function viewTarget() {
  camera.getWorldDirection(_vd);
  const o = camera.position, b = o.dot(_vd), c = o.lengthSq() - 1, h = b * b - c;
  _vp.copy(o);
  if (h > 0 && -b - Math.sqrt(h) > 0) _vp.addScaledVector(_vd, -b - Math.sqrt(h));
  _vp.normalize();
  return { lat: Math.asin(_vp.y) / DEG, lon: Math.atan2(-_vp.z, _vp.x) / DEG };
}
function loadImage(src) {
  return new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
}
async function loadUltraWindow(cLat, cLon) {
  ultra.loading = true;
  const mk = (px) => { const c = document.createElement('canvas'); c.width = c.height = px * ULTRA_TILES; return c; };
  const day = mk(600), night = mk(375), dctx = day.getContext('2d'), nctx = night.getContext('2d');
  const jobs = [];
  for (let j = 0; j < ULTRA_TILES; j++) for (let i = 0; i < ULTRA_TILES; i++) {
    const lon0 = cLon - ULTRA_SPAN / 2 + i * 10, latTop = cLat + ULTRA_SPAN / 2 - j * 10;
    const col = ((Math.round((lon0 + 180) / 10) % 36) + 36) % 36, row = Math.round((90 - latTop) / 10);
    if (row < 0 || row > 17) continue;
    jobs.push(loadImage(`${cfg.ultraBase}day/${col}_${row}.jpg`).then((im) => dctx.drawImage(im, i * 600, j * 600)));
    jobs.push(loadImage(`${cfg.ultraBase}night/${col}_${row}.jpg`).then((im) => nctx.drawImage(im, i * 375, j * 375)));
  }
  const res = await Promise.allSettled(jobs);
  ultra.loading = false;
  if (res.some((r) => r.status === 'rejected')) { ultra.failed++; return; }   // Paket fehlt/kaputt: Weltkarte bleibt
  const swap = (key, canvas, uniform) => {
    const t = new THREE.CanvasTexture(canvas);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
    ultra[key]?.dispose(); ultra[key] = t; detailUniforms[uniform].value = t;
  };
  swap('dayTex', day, 'dayDetail'); swap('nightTex', night, 'nightDetail');
  detailUniforms.detailRect.value.set(cLon, cLat, ULTRA_SPAN, ULTRA_SPAN);
  detailUniforms.cloudDetailOn.value = 0;
  ultra.center = { lat: cLat, lon: cLon };
  requestRender();
}
function updateUltra() {
  if (DETAIL) return;
  const on = ultraActive() && shownBody === 'earth' && ultra.failed < 3;
  setDetailDefine(on);
  if (!on) { detailUniforms.detailAmt.value = 0; return; }
  // erst ab näheren Ansichten (ganze Erde: die 8K-Weltkarte ist scharf genug)
  const near = cam.zoom * bodyFit() >= 1.1 || issMode();
  detailUniforms.detailAmt.value = near && ultra.dayTex ? 1 : 0;
  if (!near || ultra.loading) return;
  const t = viewTarget();
  const cLon = Math.round(t.lon / 10) * 10, cLat = Math.max(-50, Math.min(50, Math.round(t.lat / 10) * 10));
  const c = ultra.center;
  if (c && Math.abs(((t.lon - c.lon + 540) % 360) - 180) < 22 && Math.abs(t.lat - c.lat) < 22) return;
  loadUltraWindow(cLat, cLon);
}

// live clouds (alpha) also work with DETAIL: they are only used without it

const emptyTex = new THREE.DataTexture(new Uint8Array(4), 1, 1);
emptyTex.needsUpdate = true;
for (const k of ['dayDetail', 'nightDetail', 'cloudDetail']) detailUniforms[k].value ||= emptyTex;

const sunDir = new THREE.Vector3(1, 0, 0);

// --- Erde --------------------------------------------------------------------
const earthMat = new THREE.ShaderMaterial({
  defines: DETAIL ? { USE_DETAIL: '' } : {},
  uniforms: {
    dayMap: { value: dayTex },
    nightMap: { value: nightTex },
    specMap: { value: specTex },
    normalMap: { value: normalTex },
    cloudMap: { value: emptyTex },
    cloudAmt: { value: 1 },
    moonPos: { value: new THREE.Vector3(60, 0, 0) },
    sunDir: { value: sunDir },
    camPos: { value: camera.position },
    cloudGrey: { value: 0 },
    ...detailUniforms,
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPos;
    void main() {
      vUv = uv;
      vNormal = normalize(normal);
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D dayMap, nightMap, specMap, normalMap, cloudMap;
    uniform vec3 sunDir, camPos;
    uniform float cloudAmt;
    uniform vec3 moonPos;   // Erdradien, erdfest
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPos;
    ${DETAIL_GLSL}

    // Anteil der Sonnenscheibe, den eine Kugel verdeckt (Winkelradien und Abstand in Radiant)
    float occult(float ab, float as, float sep) {
      if (sep >= ab + as) return 0.0;
      float total = min(1.0, (ab * ab) / (as * as));
      float t = clamp((ab + as - sep) / max(ab + as - abs(ab - as), 1e-6), 0.0, 1.0);
      return total * t * t * (3.0 - 2.0 * t);
    }

    float moonShadow(vec3 P) {
      vec3 toM = moonPos - P; float dm = length(toM);
      float sep = acos(clamp(dot(toM / dm, sunDir), -1.0, 1.0));
      return 1.0 - 0.985 * pow(occult(asin(clamp(0.2727 / dm, 0.0, 1.0)), 0.004653, sep), 0.6);
    }

    void main() {
      vec3 N = normalize(vNormal);
      // Leichtes Relief über die Normal-Map (Tangentenraum auf der Kugel)
      vec3 T = normalize(vec3(-N.z, 0.0, N.x) + 1e-5);
      vec3 B = cross(N, T);
      vec3 nm = texture2D(normalMap, vUv).xyz * 2.0 - 1.0;
      vec3 Nb = normalize(N + 0.35 * (nm.x * T + nm.y * B));

      vec3 V = normalize(camPos - vPos);
      float sunN = dot(N, sunDir);
      float lit = dot(Nb, sunDir);

      // Tag/Nacht-Übergang mit weicher Dämmerungszone
      float dayAmt = smoothstep(-0.06, 0.14, sunN);
      float twilight = smoothstep(-0.18, 0.0, sunN) * (1.0 - smoothstep(0.0, 0.22, sunN));

      vec3 dayTexel = texture2D(dayMap, vUv).rgb;
      vec3 night = texture2D(nightMap, vUv).rgb;
      #ifdef USE_DETAIL
      vec3 dt = detailAt(vUv);
      dayTexel = mix(dayTexel, texture2D(dayDetail, dt.xy).rgb, dt.z);
      night = mix(night, texture2D(nightDetail, dt.xy).rgb, dt.z);
      #endif
      vec3 day = pow(dayTexel, vec3(1.12)) * 0.92;
      float ocean = texture2D(specMap, vUv).r;

      // Wolkenschatten: Wolkentextur leicht Richtung Sonne versetzt
      float cloud = cloudAt(cloudMap, vUv) * cloudAmt;
      float shadow = cloudAt(cloudMap, vUv + vec2(sunDir.x, sunDir.y) * 0.0015) * cloudAmt;

      float ecl = moonShadow(vPos);   // Sonnenfinsternis: Kern- und Halbschatten des Mondes
      vec3 color = day * (0.04 + 0.95 * max(lit, 0.0)) * (1.0 - 0.35 * shadow) * ecl;

      // Spiegelung der Sonne auf den Ozeanen
      vec3 H = normalize(sunDir + V);
      float spec = pow(max(dot(N, H), 0.0), 60.0) * ocean * (1.0 - cloud);
      color += vec3(1.0, 0.92, 0.78) * spec * 0.55 * dayAmt * ecl;

      // Dämmerungsfärbung
      color = mix(color, color * vec3(1.25, 0.75, 0.5) + vec3(0.06, 0.02, 0.0), twilight * 0.6);

      // Nachtseite: Stadtlichter, unter Wolken gedämpft
      // Black Marble enthält schwach sichtbares Gelände -> nur echte Lichter durchlassen
      float nl = dot(night, vec3(0.3, 0.5, 0.2));
      vec3 lights = night * smoothstep(0.12, 0.45, nl) * vec3(1.0, 0.8, 0.5) * 2.2 * (1.0 - 0.75 * cloud);
      color = mix(color, day * 0.012, 1.0 - dayAmt);
      color += lights * (1.0 - dayAmt);

      // Atmosphärischer Dunst am Rand (nur auf der beleuchteten Seite)
      float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);
      color += vec3(0.30, 0.55, 1.0) * fres * 0.6 * smoothstep(-0.05, 0.4, sunN);

      gl_FragColor = vec4(color, 1.0);
      #include <colorspace_fragment>
    }`,
});

const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), earthMat);
scene.add(earth);

// --- Wolken ------------------------------------------------------------------
const cloudMat = new THREE.ShaderMaterial({
  defines: DETAIL ? { USE_DETAIL: '' } : {},
  uniforms: { cloudMap: { value: emptyTex }, sunDir: { value: sunDir }, drift: { value: 0 }, moonPos: { value: new THREE.Vector3(60, 0, 0) }, cloudGrey: { value: 0 }, ...detailUniforms },
  transparent: true,
  depthWrite: false,
  vertexShader: /* glsl */`
    varying vec2 vUv; varying vec3 vNormal;
    void main() {
      vUv = uv; vNormal = normalize(normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D cloudMap; uniform vec3 sunDir, moonPos; uniform float drift;
    varying vec2 vUv; varying vec3 vNormal;
    ${DETAIL_GLSL}
    // Anteil der Sonnenscheibe, den eine Kugel verdeckt (Winkelradien und Abstand in Radiant)
    float occult(float ab, float as, float sep) {
      if (sep >= ab + as) return 0.0;
      float total = min(1.0, (ab * ab) / (as * as));
      float t = clamp((ab + as - sep) / max(ab + as - abs(ab - as), 1e-6), 0.0, 1.0);
      return total * t * t * (3.0 - 2.0 * t);
    }

    void main() {
      float a = cloudAt(cloudMap, vUv + vec2(drift, 0.0));
      float sunN = dot(normalize(vNormal), sunDir);
      vec3 toM = moonPos - normalize(vNormal); float dm = length(toM);
      float light = smoothstep(-0.12, 0.25, sunN) *
        (1.0 - 0.985 * occult(asin(clamp(0.2727 / dm, 0.0, 1.0)), 0.004653, acos(clamp(dot(toM / dm, sunDir), -1.0, 1.0))));
      vec3 col = mix(vec3(0.02, 0.025, 0.04), vec3(1.0), light);
      // Wolken an der Terminatorlinie warm anleuchten
      float tw = smoothstep(-0.12, 0.02, sunN) * (1.0 - smoothstep(0.02, 0.2, sunN));
      col = mix(col, vec3(1.0, 0.62, 0.38), tw * 0.7);
      gl_FragColor = vec4(col, a * mix(0.25, 0.95, light));
      #include <colorspace_fragment>
    }`,
});
const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.006, 256, 128), cloudMat);
scene.add(clouds);

// Live-Wolkenbild (alle ~3 h aktualisiert, Quelle: github.com/matteason/live-cloud-maps).
// 8K nur für nahe Ansichten – spart sonst ~200 MB Grafikspeicher.
const liveCloudsUrl = (res) => `https://clouds.matteason.co.uk/images/${res}/clouds-alpha.png`;
const wantedCloudRes = () => (cfg.detail !== 'standard' || cfg.zoom > 1.5 || String(cfg.motion).startsWith('iss') ? '8192x4096' : '4096x2048');
let liveCloudTex = null, liveCloudRes = null, liveCloudLoading = false;
function setCloudTex(t) {
  cloudMat.uniforms.cloudMap.value = t;
  earthMat.uniforms.cloudMap.value = t;
  cloudMat.uniforms.cloudGrey.value = earthMat.uniforms.cloudGrey.value = t?.userData?.grey ? 1 : 0;
  requestRender();
}
// Nach einem Fehlschlag (offline, Server nicht erreichbar) statische Wolken zeigen und
// erst nach einer Wartezeit erneut versuchen: 1, 2, 4 … höchstens 60 Minuten.
let liveCloudRetryAt = 0, liveCloudFailures = 0;
function loadLiveClouds() {
  if (cfg.clouds !== 'live' || liveCloudLoading || Date.now() < liveCloudRetryAt) return;
  if ((BODIES[cfg.body] ? cfg.body : 'earth') !== 'earth') return;  // Wolken gibt es nur auf der Erde
  const res = wantedCloudRes();
  liveCloudLoading = true;
  loader.setCrossOrigin('anonymous');
  // Die Karten werden alle 3 h aktualisiert: gleicher Parameter innerhalb von 3 h,
  // damit der stündliche Check aus dem Browser-Cache kommt und den Server nicht belastet.
  loader.load(`${liveCloudsUrl(res)}?t=${Math.floor(Date.now() / 1.08e7)}`, (t) => {
    liveCloudLoading = false;
    liveCloudFailures = 0;
    liveCloudRetryAt = 0;
    t.anisotropy = maxAniso;
    t.wrapS = THREE.RepeatWrapping;
    liveCloudTex?.dispose();
    liveCloudTex = t;
    liveCloudRes = res;
    applyCloudMode();
  }, undefined, () => {
    liveCloudLoading = false;
    liveCloudFailures++;
    liveCloudRetryAt = Date.now() + Math.min(60, 2 ** (liveCloudFailures - 1)) * 60 * 1000;
    applyCloudMode();  // zeigt statische Wolken; neuer Versuch erst nach liveCloudRetryAt
  });
}
function applyCloudMode() {
  clouds.visible = cfg.clouds !== 'off';
  earthMat.uniforms.cloudAmt.value = cfg.clouds === 'off' ? 0 : 1;
  if (cfg.clouds === 'live' && (!liveCloudTex || liveCloudRes !== wantedCloudRes())) loadLiveClouds();
  if (cfg.clouds === 'off') setCloudTex(emptyTex);
  else setCloudTex(cfg.clouds === 'live' && liveCloudTex ? liveCloudTex : staticClouds());
}
const liveCloudsActive = () => cfg.clouds === 'live' && !!liveCloudTex;
setInterval(loadLiveClouds, 60 * 60 * 1000);

// --- Atmosphäre (Glow um die Erde) ---------------------------------------
const ATMO = 1.03;
const atmoMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: sunDir }, camPos: { value: camera.position } },
  side: THREE.BackSide,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 sunDir, camPos;
    varying vec3 vPos;
    void main() {
      // Tiefster Punkt des Sichtstrahls über der Erdoberfläche
      vec3 D = normalize(vPos - camPos);
      float t = max(-dot(camPos, D), 0.0);
      vec3 closest = camPos + D * t;
      float h = (length(closest) - 1.0) / ${(ATMO - 1).toFixed(3)};
      float glow = pow(clamp(1.0 - h, 0.0, 1.0), 3.0);
      // Kamera innerhalb der Lufthülle: Strahlen nach oben (t = 0) leuchten nicht
      glow *= smoothstep(0.0, 0.08, t);
      float sunN = dot(normalize(closest), sunDir);
      float lit = smoothstep(-0.2, 0.25, sunN);
      vec3 col = mix(vec3(1.0, 0.42, 0.18), vec3(0.32, 0.6, 1.0), smoothstep(-0.06, 0.18, sunN));
      gl_FragColor = vec4(col * glow * lit * 1.5, 1.0);
      #include <colorspace_fragment>
    }`,
});
const atmo = new THREE.Mesh(new THREE.SphereGeometry(ATMO, 160, 80), atmoMat);
scene.add(atmo);

// --- Planeten & Mond -----------------------------------------------------------
// Ein gemeinsamer Shader für alle anderen Körper: Textur, echte Beleuchtung (Sonne aus
// planets.js), weiche Randverdunkelung, Dunst am Rand, bei Saturn Ringe mit Schatten.
const planetMat = new THREE.ShaderMaterial({
  uniforms: {
    map: { value: emptyTex }, sunDir: { value: sunDir }, camPos: { value: camera.position },
    ambient: { value: new THREE.Color(0, 0, 0) }, rough: { value: 0.7 },
    haloColor: { value: new THREE.Color(0, 0, 0) }, haloAmt: { value: 0 },
    ringMap: { value: emptyTex }, ringInner: { value: 0 }, ringOuter: { value: 0 },
    flowAmt: { value: 0 }, flowTime: { value: 0 }, vortex: { value: new THREE.Vector3(0, 0, 0.001) },
    shadowPos: { value: new THREE.Vector3() }, shadowR: { value: 0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv; varying vec3 vNormal; varying vec3 vPos;
    void main() {
      vUv = uv; vNormal = normalize(normal); vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D map, ringMap;
    uniform vec3 sunDir, camPos, ambient, haloColor;
    uniform float rough, haloAmt, ringInner, ringOuter;
    uniform float flowAmt, flowTime;
    uniform vec3 vortex;  // u, v, radius (uv units) – e.g. Jupiter's Great Red Spot
    uniform vec3 shadowPos; uniform float shadowR;   // Mond: Erde (in Mondradien) – Mondfinsternis
    varying vec2 vUv; varying vec3 vNormal; varying vec3 vPos;

    // Anteil der Sonnenscheibe, den eine Kugel verdeckt (Winkelradien und Abstand in Radiant)
    float occult(float ab, float as, float sep) {
      if (sep >= ab + as) return 0.0;
      float total = min(1.0, (ab * ab) / (as * as));
      float t = clamp((ab + as - sep) / max(ab + as - abs(ab - as), 1e-6), 0.0, 1.0);
      return total * t * t * (3.0 - 2.0 * t);
    }

    // Gasplaneten: Wolkenbänder strömen gegeneinander, ein Wirbel dreht sich.
    // Zwei zeitversetzte Phasen werden überblendet, damit sich nichts aufschaukelt.
    vec3 albedoAt(vec2 uv) {
      if (flowAmt <= 0.0) return texture2D(map, uv).rgb;
      float lat = (uv.y - 0.5) * 3.14159265;
      vec2 flow = vec2((sin(lat * 13.0) * 0.65 + sin(lat * 6.0 + 1.3) * 0.35) * 0.0035, 0.0);
      vec2 d = (uv - vortex.xy) * vec2(2.0, 1.0);
      float w = exp(-dot(d, d) / (vortex.z * vortex.z));
      flow += vec2(d.y, -d.x * 0.5) * w * 0.35;
      flow *= flowAmt;
      float p0 = fract(flowTime), p1 = fract(flowTime + 0.5);
      vec3 a = texture2D(map, uv + flow * (p0 - 0.5)).rgb;
      vec3 b = texture2D(map, uv + flow * (p1 - 0.5)).rgb;
      return mix(a, b, abs(p0 - 0.5) * 2.0);
    }

    void main() {
      vec3 N = normalize(vNormal);
      vec3 V = normalize(camPos - vPos);
      float mu0 = dot(N, sunDir), mu = max(dot(N, V), 0.0);
      // Minnaert-Beleuchtung: rough ~0.5 = Mondgestein (hell bis zum Rand), ~0.9 = Wolkenplanet
      float light = mu0 > 0.0 ? pow(mu0, rough) * pow(max(mu, 0.05), rough - 1.0) : 0.0;
      light = min(light * smoothstep(-0.02, 0.06, mu0) * 1.08, 1.4);
      // Schatten der Saturnringe auf dem Planeten
      if (ringOuter > 0.0 && abs(sunDir.y) > 1e-4) {
        float t = -vPos.y / sunDir.y;
        if (t > 0.0) {
          float r = length((vPos + sunDir * t).xz);
          if (r > ringInner && r < ringOuter)
            light *= 1.0 - 0.8 * texture2D(ringMap, vec2((r - ringInner) / (ringOuter - ringInner), 0.5)).a;
        }
      }
      vec3 albedo = albedoAt(vUv);
      vec3 eclipseGlow = vec3(0.0);
      if (shadowR > 0.0) {
        vec3 toE = shadowPos - vPos; float de = length(toE);
        float sep = acos(clamp(dot(toE / de, sunDir), -1.0, 1.0));
        float hidden = occult(asin(clamp(shadowR / de, 0.0, 1.0)), 0.004653, sep);
        // In der Totalität leuchtet der Mond rötlich: Sonnenlicht, das die Erdatmosphäre bricht
        eclipseGlow = vec3(0.55, 0.16, 0.06) * smoothstep(0.85, 1.0, hidden) * max(mu0 + 0.15, 0.0) * 0.22;
        light *= 1.0 - hidden;
      }
      vec3 color = albedo * (light + ambient * 2.5 * (1.0 - smoothstep(0.0, 0.2, mu0)) + eclipseGlow);
      // Dunst am Rand der Tagseite
      float fres = pow(1.0 - mu, 3.0);
      color += haloColor * fres * haloAmt * 0.6 * smoothstep(-0.1, 0.35, mu0);
      gl_FragColor = vec4(color, 1.0);
      #include <colorspace_fragment>
    }`,
});
const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 96), planetMat);

// Leuchtsaum außerhalb des Planetenrands (dünne Atmosphäre: Mars, Venus, Gasplaneten)
const haloMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: sunDir }, camPos: { value: camera.position },
              color: { value: new THREE.Color(0, 0, 0) }, amount: { value: 0 } },
  side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: atmoMat.vertexShader,
  fragmentShader: /* glsl */`
    uniform vec3 sunDir, camPos, color; uniform float amount;
    varying vec3 vPos;
    void main() {
      vec3 D = normalize(vPos - camPos);
      float t = max(-dot(camPos, D), 0.0);
      vec3 closest = camPos + D * t;
      float h = (length(closest) - 1.0) / 0.025;
      float glow = pow(clamp(1.0 - h, 0.0, 1.0), 2.5) * smoothstep(0.0, 0.08, t);
      float lit = smoothstep(-0.15, 0.3, dot(normalize(closest), sunDir));
      gl_FragColor = vec4(color * glow * lit * amount, 1.0);
      #include <colorspace_fragment>
    }`,
});
const halo = new THREE.Mesh(new THREE.SphereGeometry(1.025, 128, 64), haloMat);

// Saturnringe: flach in der Äquatorebene (y = 0), beidseitig, mit Planetenschatten
const ringMat = new THREE.ShaderMaterial({
  uniforms: { ringMap: { value: emptyTex }, sunDir: { value: sunDir }, camPos: { value: camera.position },
              ringInner: { value: 1.22 }, ringOuter: { value: 2.32 } },
  side: THREE.DoubleSide, transparent: true, depthWrite: false,
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D ringMap; uniform vec3 sunDir, camPos; uniform float ringInner, ringOuter;
    varying vec3 vPos;
    void main() {
      float r = length(vPos.xz);
      vec4 tx = texture2D(ringMap, vec2((r - ringInner) / (ringOuter - ringInner), 0.5));
      // Schatten des Planeten auf den Ringen
      float b = dot(vPos, sunDir), c = dot(vPos, vPos) - 1.0, disc = b * b - c;
      float shadow = (disc > 0.0 && -b - sqrt(disc) > 0.0) ? 0.04 : 1.0;
      // Von der unbeleuchteten Seite gesehen scheint nur Licht durch die Ringe
      bool sameSide = sign(camPos.y) == sign(sunDir.y);
      float lit = sameSide ? 0.25 + 0.95 * abs(sunDir.y) / (abs(sunDir.y) + 0.05) : 0.35 * (1.0 - 0.6 * tx.a);
      gl_FragColor = vec4(tx.rgb * lit * shadow, tx.a);
      #include <colorspace_fragment>
    }`,
});
const ringGeo = new THREE.RingGeometry(1.22, 2.32, 256, 1);
ringGeo.rotateX(-Math.PI / 2);
const ring = new THREE.Mesh(ringGeo, ringMat);

// --- Polarlichter -------------------------------------------------------------
// Leuchtende Ovale um die magnetischen Pole: auf der Erde grün mit rotem Saum, nur auf der
// Nachtseite; auf Jupiter und Saturn (dort im UV) bläulich wie auf Hubble-Bildern.
const auroraMat = new THREE.ShaderMaterial({
  uniforms: {
    sunDir: { value: sunDir }, camPos: { value: camera.position }, time: { value: 0 },
    poleN: { value: new THREE.Vector3(0, 1, 0) }, poleS: { value: new THREE.Vector3(0, -1, 0) },
    colat: { value: 0.4 }, width: { value: 0.06 }, strength: { value: 0 },
    colorLow: { value: new THREE.Color(0.15, 1.0, 0.45) }, colorHigh: { value: new THREE.Color(0.9, 0.2, 0.45) },
    nightOnly: { value: 1 }, rayAmt: { value: 0.55 }, layer: { value: 0 },
    ovMap: { value: null }, useOv: { value: 0 },   // Erde: Stärke und Ort aus NOAA OVATION
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 sunDir, camPos, poleN, poleS, colorLow, colorHigh;
    uniform float time, colat, width, strength, nightOnly, rayAmt, layer, useOv;
    uniform sampler2D ovMap;
    varying vec3 vPos;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    float oval(vec3 P, vec3 pole, float seed) {
      float c = acos(clamp(dot(P, pole), -1.0, 1.0));
      if (useOv < 0.5 && abs(c - colat) > colat * 0.2 + width * 4.0) return 0.0;  // weit weg vom Oval: nichts zu tun
      vec3 r1 = normalize(cross(pole, abs(pole.y) < 0.99 ? vec3(0, 1, 0) : vec3(1, 0, 0)));
      vec3 r2 = cross(pole, r1);
      float phi = atan(dot(P, r2), dot(P, r1));
      float n1 = noise(vec2(phi * 2.5 + seed, time * 0.035));
      float n2 = noise(vec2(phi * 9.0 - time * 0.06, seed + time * 0.05));
      // Oval leicht zur Nachtseite verschoben und wellig
      float center = colat * (1.0 + 0.12 * dot(normalize(P - pole * dot(P, pole)), -sunDir)) + width * (n1 - 0.5) * 1.6;
      float d = (c - center) / width;
      float band = exp(-d * d * 1.8);
      float rays = 1.0 - rayAmt + rayAmt * pow(noise(vec2(phi * 60.0 + n1 * 8.0, time * 0.25 + seed)), 1.5);
      // Helle Bögen und dunkle Lücken entlang des Ovals
      float arcs = smoothstep(0.25, 0.75, noise(vec2(phi * 4.0 + seed * 3.0, time * 0.02)));
      return (useOv > 0.5 ? 1.0 : band) * rays * (0.15 + 0.85 * arcs) * (0.35 + 0.9 * n2);
    }
    float ovAt(vec3 P) {
      float lat = asin(clamp(P.y, -1.0, 1.0)), lon = atan(-P.z, P.x);
      return texture2D(ovMap, vec2(fract(lon / 6.2831853), (lat / 3.1415927 + 0.5) * (180.0 / 181.0) + 0.5 / 181.0)).r;
    }
    void main() {
      vec3 P = normalize(vPos);
      vec3 V = normalize(camPos - vPos);
      float dark = 1.0 - smoothstep(-0.14, 0.06, dot(P, sunDir));
      if (nightOnly > 0.5 && dark <= 0.0) discard;
      float a;
      if (useOv > 0.5) {   // Erde: nur wo die NOAA Polarlichter sieht; weicher Schein mit sanften Bögen
        float I = smoothstep(0.08, 0.5, ovAt(P));
        if (I < 0.002) discard;
        vec3 pole = P.y > 0.0 ? poleN : poleS;
        float c = acos(clamp(dot(P, pole), -1.0, 1.0));
        vec3 q1 = normalize(cross(pole, abs(pole.y) < 0.99 ? vec3(0, 1, 0) : vec3(1, 0, 0)));
        float phi = atan(dot(P, cross(pole, q1)), dot(P, q1));
        float fold = (noise(vec2(phi * 4.0 + time * 0.015, 3.1)) - 0.5) * 0.04;
        float k = (c + fold) * 60.0;
        float arc = smoothstep(0.6, 0.98, 1.0 - abs(fract(k) * 2.0 - 1.0)) *
                    smoothstep(0.7 - 0.3 * I, 0.95 - 0.2 * I, noise(vec2(floor(k) * 2.3 + time * 0.01, phi * 2.5)));
        a = I * (0.45 + 1.4 * arc * I) * (0.8 + 0.2 * noise(vec2(phi * 40.0, time * 0.1)));
      } else a = oval(P, poleN, 0.0) + oval(P, poleS, 17.0);
      if (a <= 0.0) discard;
      a *= mix(1.0, dark, nightOnly);
      // Schräg gesehen wirkt der Vorhang dichter
      a *= 1.0 + 0.8 * pow(1.0 - max(dot(P, V), 0.0), 3.0);
      vec3 col = mix(colorLow, colorHigh, layer);
      gl_FragColor = vec4(col * a * strength, 1.0);
      #include <colorspace_fragment>
    }`,
});
// Drei gestaffelte Schichten: unten grün, oben rot/violett – am Horizont wirkt das wie hohe Vorhänge
const auroraLayers = [[1.010, 0, 1], [1.018, 0.12, 0.5], [1.028, 1, 0.22]].map(([r, layer, k]) => {
  const m = auroraMat.clone();
  m.uniforms = THREE.UniformsUtils.clone(auroraMat.uniforms);
  m.uniforms.sunDir.value = sunDir; m.uniforms.camPos.value = camera.position;
  m.uniforms.layer.value = layer;
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 192, 96), m);
  mesh.userData.k = k; mesh.visible = false; scene.add(mesh);
  return mesh;
});
const aurora = { get visible() { return auroraLayers[0].visible; },
                 set visible(v) { auroraLayers.forEach((m) => { m.visible = v; }); } };

// Erde: Polarlichter als Volumen zwischen 90 und 300 km Höhe, per Raymarching. Wo und wie stark:
// NOAA OVATION (Wahrscheinlichkeit sichtbarer Polarlichter im 1°-Raster; geladen alle 30 min).
// Form: dünne, gefaltete Vorhänge entlang der magnetischen Breitenkreise mit senkrechten Strahlen,
// unten ein scharfer grüner Saum (~100 km), darüber ausklingend und oben rötlich.
const ovationData = new Uint8Array(360 * 181);
const ovationTex = new THREE.DataTexture(ovationData, 360, 181, THREE.RedFormat, THREE.UnsignedByteType);
ovationTex.wrapS = THREE.RepeatWrapping; ovationTex.magFilter = ovationTex.minFilter = THREE.LinearFilter;
ovationTex.needsUpdate = true;
const AURORA_R0 = 1 + 90 / 6371, AURORA_R1 = 1 + 300 / 6371;
const earthAuroraMat = new THREE.ShaderMaterial({
  uniforms: {
    ovMap: { value: ovationTex }, sunDir: { value: sunDir }, camPos: { value: camera.position }, time: { value: 0 },
    poleN: { value: new THREE.Vector3(0, 1, 0) }, poleS: { value: new THREE.Vector3(0, -1, 0) }, strength: { value: 1 },
    steps: { value: 56 },   // Abtastschritte: 96 mit „Maximale Qualität“, sonst 56 (schont ältere Macs)
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    varying vec3 vPos;
    void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D ovMap; uniform vec3 sunDir, camPos, poleN, poleS; uniform float time, strength, steps;
    varying vec3 vPos;
    const float R0 = ${AURORA_R0.toFixed(6)}, R1 = ${AURORA_R1.toFixed(6)}, KM = 6371.0;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    vec2 sphere(vec3 ro, vec3 rd, float r) {
      float b = dot(ro, rd), c = dot(ro, ro) - r * r, h = b * b - c;
      if (h < 0.0) return vec2(-1.0);
      h = sqrt(h); return vec2(-b - h, -b + h);
    }
    // OVATION-Wahrscheinlichkeit (0..1) an einer Richtung P (Längengrad 0..359 Ost, Breite -90..90)
    float ovAt(vec3 P) {
      float lat = asin(clamp(P.y, -1.0, 1.0)), lon = atan(-P.z, P.x);
      return texture2D(ovMap, vec2(fract(lon / 6.2831853), (lat / 3.1415927 + 0.5) * (180.0 / 181.0) + 0.5 / 181.0)).r;
    }
    float dark(vec3 P) { return 1.0 - smoothstep(-0.16, 0.04, dot(P, sunDir)); }
    // Sichtbarkeit aus der OVATION-Wahrscheinlichkeit: ab ~10 % möglich, ab ~50 % kräftig
    float visI(float ov) { return smoothstep(0.08, 0.5, ov); }
    // Vorhänge: ein weicher, diffuser Schein; einzelne schmale Bögen nur, wo die Aktivität hoch ist.
    // Die Bögen folgen den magnetischen Breitenkreisen, falten sich und reißen ab; leichte Strahlen.
    float curtain(vec3 P, float I) {
      vec3 pole = dot(P, poleN) > 0.0 ? poleN : poleS;
      float c = acos(clamp(dot(P, pole), -1.0, 1.0));
      vec3 r1 = normalize(cross(pole, abs(pole.y) < 0.99 ? vec3(0, 1, 0) : vec3(1, 0, 0)));
      float phi = atan(dot(P, cross(pole, r1)), dot(P, r1));
      float fold = (noise(vec2(phi * 4.0 + time * 0.015, 3.1)) - 0.5) * 0.04
                 + (noise(vec2(phi * 16.0 - time * 0.04, 7.7)) - 0.5) * 0.01;
      float k = (c + fold) * 60.0;                          // Abstand möglicher Bögen ~1° (110 km)
      float band = 1.0 - abs(fract(k) * 2.0 - 1.0);
      float sheet = smoothstep(0.86, 0.985, band);          // ~10 km dünne Vorhänge
      float alive = smoothstep(0.75 - 0.35 * I, 0.95 - 0.2 * I, noise(vec2(floor(k) * 2.3 + time * 0.01, phi * 2.5 + floor(k) * 0.9)));
      float rays = 0.7 + 0.3 * noise(vec2(phi * 300.0 + fold * 600.0, time * 0.3));
      return 0.35 + sheet * alive * rays * 3.0 * I;
    }
    void main() {
      vec3 ro = camPos, rd = normalize(vPos - camPos);
      vec2 outer = sphere(ro, rd, R1);
      if (outer.y <= 0.0) discard;
      float t0 = max(outer.x, 0.0), t1 = outer.y;
      vec2 ground = sphere(ro, rd, 1.0);
      if (ground.x > 0.0) t1 = min(t1, ground.x);           // hinter der Erde ist nichts
      vec2 inner = sphere(ro, rd, R0);
      // Grobe Vorprüfung: Polarlicht und Dunkelheit an Ein-, Mittel- und Austrittspunkt
      float maxOv = 0.0;
      for (int j = 0; j <= 8; j++) {
        vec3 Q = normalize(ro + rd * mix(t0, t1, float(j) / 8.0));
        maxOv = max(maxOv, visI(ovAt(Q)) * dark(Q));
      }
      if (maxOv < 0.002) discard;
      const int N = 96;
      // gleichmäßig verteilter Versatz je Pixel (weniger Körnung als Zufallsrauschen)
      float jitter = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
      float dt = (t1 - t0) / steps;
      vec3 col = vec3(0.0);
      for (int i = 0; i < N; i++) {
        if (float(i) >= steps) break;
        float t = t0 + (float(i) + jitter) * dt;
        vec3 X = ro + rd * t;
        float r = length(X);
        if (r < R0) continue;                               // unter 90 km: kein Polarlicht
        vec3 P = X / r;
        float I = visI(ovAt(P)) * dark(P);
        if (I < 0.002) continue;
        float h = (r - 1.0) * KM;

    sunMat.uniforms.sdoRadius.value = (rr - l) / 2 / img.width;
    sunMat.uniforms.hasSdo.value = rr - l > img.width * 0.4 ? 1 : 0;
    sdoState = 'ok'; requestRender();
  };
  img.onerror = () => { sdoState = 'failed'; setTimeout(() => { sdoState = 'none'; }, 30 * 60 * 1000); };
  img.src = `remote/sdo/latest_1024_HMIIC.jpg?t=${Math.floor(Date.now() / 3.6e6)}`;
}
setInterval(() => { if (shownBody === 'sun' && sdoState === 'ok') { sdoState = 'none'; loadSdo(); } }, 60 * 60 * 1000);

const earthParts = [earth, clouds, atmo];
const planetParts = [planet, halo, ring];
planetParts.forEach((o) => { o.visible = false; scene.add(o); });
const bodyTextures = {};
function bodyTex(file, srgb = true) {
  return (bodyTextures[file] ||= tex(`textures/planets/${file}`, srgb));
}

// Zeigt den gewählten Körper. Texturen anderer Planeten werden freigegeben (Grafikspeicher).
let shownBody = null;
let litFromEarth = 1;   // beleuchteter Anteil, von der Erde aus gesehen (für „Von der Erde aus“)
function applyBody() {
  const id = BODIES[cfg.body] ? cfg.body : 'earth';
  if (id === shownBody) return;
  shownBody = id;
  const isEarth = id === 'earth', isSun = id === 'sun';
  earthParts.forEach((o) => { o.visible = isEarth; });
  if (isEarth) applyCloudMode();
  planet.visible = !isEarth && !isSun;
  sunMesh.visible = isSun;
  if (isSun) loadSdo();
  const b = BODIES[id];
  for (const [file, t] of Object.entries(bodyTextures)) {
    if (file !== b.map && file !== b.ring?.map) { t.dispose(); delete bodyTextures[file]; }
  }
  if (isSun) { halo.visible = false; ring.visible = false; }
  if (!isEarth && !isSun) {
    planetMat.uniforms.map.value = bodyTex(b.map);
    planetMat.uniforms.ambient.value.setRGB(...b.ambient);
    planetMat.uniforms.rough.value = b.rough;
    planetMat.uniforms.shadowR.value = id === 'moon' ? 6378.137 / 1737.4 : 0;   // Erdschatten → Mondfinsternis
    halo.visible = !!b.halo;
    if (b.halo) { haloMat.uniforms.color.value.setRGB(...b.halo); haloMat.uniforms.amount.value = b.haloAmt; }
    planetMat.uniforms.haloColor.value.setRGB(...(b.halo || [0, 0, 0]));
    planetMat.uniforms.haloAmt.value = b.haloAmt || 0;
    ring.visible = !!b.ring;
    planetMat.uniforms.ringOuter.value = b.ring ? b.ring.outer : 0;
    if (b.ring) {
      const rt = bodyTex(b.ring.map);
      planetMat.uniforms.ringMap.value = rt; ringMat.uniforms.ringMap.value = rt;
      planetMat.uniforms.ringInner.value = b.ring.inner;
      ringMat.uniforms.ringInner.value = b.ring.inner; ringMat.uniforms.ringOuter.value = b.ring.outer;
    }
  }
  applyEffects();
  requestRender();
}
const bodyFit = () => BODIES[shownBody]?.fit || 1;
function applyEffects() {
  const st = STORMS[shownBody];
  planetMat.uniforms.flowAmt.value = cfg.fx && st ? st.amount : 0;
  applyISS();
  if (st) planetMat.uniforms.vortex.value.set(...st.vortex);
  applyAurora();
}

// Sonne (und Erde) vom gewählten Körper aus gesehen
function bodySun(date) {
  if (shownBody === 'earth') return { sun: subsolarPoint(date), earth: null };
  if (shownBody === 'sun') return { sun: { lat: 0, lon: 0 }, earth: null, earthDistance: 1 };
  return bodyState(shownBody, date);
}

// --- Sterne ------------------------------------------------------------------
{
  const n = 4000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(400);
    pos.set([v.x, v.y, v.z], i * 3);
    const b = Math.pow(Math.random(), 3) * 0.9 + 0.1;
    const warm = Math.random();
    col.set([b * (0.85 + 0.15 * warm), b * 0.9, b * (1.0 - 0.15 * warm)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    size: 1.3, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.85,
  })));
}

// --- Kamera ------------------------------------------------------------------
// Alle Kameragrößen werden weich zum Zielwert geführt, damit Wechsel von Ort,
// Ansicht oder Zoom wie ein Kameraflug wirken.
const cam = { lat: cfg.lat, lon: cfg.lon, zoom: cfg.zoom, pitch: cfg.pitch, heading: cfg.heading,
              tilt: cfg.tilt, fov: cfg.fov, x: cfg.x, y: cfg.y };
let orbitLon = 0;
const wrap180 = (a) => ((a % 360) + 540) % 360 - 180;

// Wohin die Kamera schaut. st = bodySun(): Sonne (und Erde) vom Körper aus gesehen.
function targetLon(st) {
  if (cfg.motion === 'orbit') return cfg.lon + orbitLon;
  if (cfg.motion === 'sun') return st.sun.lon - 55;
  if (cfg.motion === 'earth' && st.earth) return st.earth.lon;
  return cfg.lon;
}
function targetLat(st) {
  return cfg.motion === 'earth' && st.earth ? st.earth.lat : cfg.lat;
}

const _n = new THREE.Vector3(), _north = new THREE.Vector3(), _east = new THREE.Vector3();
const _fwd = new THREE.Vector3(), _dir = new THREE.Vector3(), _up = new THREE.Vector3();
function updateCamera(dt, st) {
  if (issMode()) { settling = false; return updateIssCamera(); }
  if (shownBody === 'earth' && cfg.motion === 'earth-moon') { settling = false; return updateEarthMoonCamera(); }
  if (camera.near !== 0.1 || camera.far !== 1000) { camera.near = 0.1; camera.far = 1000; camera.updateProjectionMatrix(); }
  const k = capture ? 1 : 1 - Math.exp(-dt * 1.6);
  const target = { ...cfg, lat: targetLat(st), zoom: cfg.zoom * bodyFit() };
  for (const key of ['lat', 'zoom', 'pitch', 'heading', 'tilt', 'fov', 'x', 'y']) {
    cam[key] += (target[key] - cam[key]) * k;
  }
  const lonErr = wrap180(targetLon(st) - cam.lon);
  cam.lon += lonErr * k;
  // Noch im Kameraflug? (Orbit-Nachlauf zählt nicht: der ist gleichmäßig)
  settling = ['lat', 'zoom', 'pitch', 'heading', 'tilt', 'fov', 'x', 'y']
    .some((key) => Math.abs(target[key] - cam[key]) > (key === 'zoom' ? 0.002 : 0.02)) ||
    (cfg.motion !== 'orbit' && Math.abs(lonErr) > 0.02) ||
    (cfg.motion === 'orbit' && Math.abs(lonErr) > Math.abs(cfg.speed) / 1.6 + 0.5);

  if (Math.abs(camera.fov - cam.fov) > 1e-4) { camera.fov = cam.fov; }
  const halfFov = cam.fov * DEG / 2;
  const dist = Math.max(1.004, 1 / Math.sin(Math.atan(cam.zoom * Math.tan(halfFov))));

  // Lokales Koordinatensystem über dem Ort: n = oben, north/east = Tangenten
  latLonToVec(Math.max(-89.9, Math.min(89.9, cam.lat)), cam.lon, _n);
  _north.set(0, 1, 0).addScaledVector(_n, -_n.y).normalize();
  _east.crossVectors(_north, _n);
  const h = cam.heading * DEG, p = cam.pitch * DEG;
  _fwd.copy(_north).multiplyScalar(Math.cos(h)).addScaledVector(_east, Math.sin(h));
  _dir.copy(_n).multiplyScalar(-Math.cos(p)).addScaledVector(_fwd, Math.sin(p));
  _up.copy(_n).multiplyScalar(Math.sin(p)).addScaledVector(_fwd, Math.cos(p));
  _up.applyAxisAngle(_dir, cam.tilt * DEG);

  camera.position.copy(_n).multiplyScalar(dist);
  camera.up.copy(_up);
  camera.lookAt(camera.position.x + _dir.x, camera.position.y + _dir.y, camera.position.z + _dir.z);
  // Bildausschnitt verschieben (Lens-Shift, ohne die Perspektive zu verzerren)
  camera.setViewOffset(innerWidth, innerHeight, -cam.x * innerWidth / 2, cam.y * innerHeight / 2, innerWidth, innerHeight);
}

window.applyConfig = (c) => {
  const moved = ('lat' in c && c.lat !== cfg.lat) || ('lon' in c && c.lon !== cfg.lon) ||
                ('motion' in c && c.motion !== cfg.motion) || ('body' in c && c.body !== cfg.body);
  // Beim Ortswechsel fliegt die Kamera hin und kreist (im Orbit-Modus) von dort weiter
  if (moved) orbitLon = 0;
  const cloudsChanged = ('clouds' in c && c.clouds !== cfg.clouds) || ('detail' in c && c.detail !== cfg.detail);
  Object.assign(cfg, c);
  hud.style.display = cfg.hud ? 'block' : 'none';
  applyPixelRatio();
  renderer.setSize(innerWidth, innerHeight);
  applyBody();
  applyEffects();
  applyDetail();
  if (shownBody === 'earth' && (cloudsChanged || (liveCloudRes && liveCloudRes !== wantedCloudRes()))) applyCloudMode();
  boostUntil = performance.now() + 1500;
  requestRender();
};

// Von der App aufgerufen, wenn das Fenster verdeckt ist oder die Bildschirme schlafen
window.setPaused = (p) => {
  paused = !!p;
  if (!paused) requestRender();
};

// --- HUD ---------------------------------------------------------------------
const hud = document.getElementById('hud');
if (cfg.hud) hud.style.display = 'block';
function fmtCoord(v, pos, neg) { return `${Math.abs(v).toFixed(1)}° ${v >= 0 ? pos : neg}`; }

// --- Loop --------------------------------------------------------------------
// Die Bildrate passt sich an, wie schnell sich das Bild tatsächlich bewegt:
// Kameraflüge laufen mit voller Rate, das langsame Umkreisen mit wenigen Bildern
// pro Sekunde (Bewegung ≤ 1 px pro Bild) und eine stehende Kamera wird nur alle
// paar Sekunden neu gezeichnet. Dazwischen schläft die Seite komplett.
let paused = false, timer = 0, rafPending = false;
let lastRender = 0, lastSec = performance.now() / 1000, boostUntil = 0, settling = true;
const SIDEREAL_DEG_PER_SEC = 360 / 86164;

function desiredFps() {
  if (settling || performance.now() < boostUntil || issMode()) return cfg.fps;
  // Polarlicht-Vorhänge und Sturmbänder bewegen sich langsam: wenige Bilder pro Sekunde genügen
  // Polarlichter: 20 fps wirken flüssig; mit „Maximale Qualität“ die volle Bildrate
  const fxFloor = auroraInView() ? (cfg.fps >= 60 ? cfg.fps : 20) : stormsActive() ? 4 : 0;
  // Erdradius in Gerätepixeln; geneigte Kamera = Oberfläche näher, Bewegung schneller
  const radiusPx = Math.min(cam.zoom, 12) * innerHeight / 2 * renderer.getPixelRatio() * (1 + 2 * Math.sin(cam.pitch * DEG));
  const degPerSec = cfg.motion === 'orbit' ? Math.abs(cfg.speed)
                  : cfg.motion === 'sun' || cfg.motion === 'earth'
                    ? (shownBody === 'earth' ? SIDEREAL_DEG_PER_SEC : Math.abs(rotationDegPerDay(shownBody)) / 86400) * cfg.warp
                  : 0;
  const pxPerSec = degPerSec * DEG * radiusPx;
  return Math.min(cfg.fps, Math.max(0.2, fxFloor, pxPerSec / 1.0));
}

function requestRender() {
  clearTimeout(timer);
  timer = 0;
  schedule(0);
}

function schedule(delayMs) {
  if (paused || rafPending || timer) return;
  timer = setTimeout(() => {
    timer = 0;
    rafPending = true;
    requestAnimationFrame(frame);
  }, delayMs);
}

function frame() {
  rafPending = false;
  if (paused) return;
  const sec = capture ? capture.sec : performance.now() / 1000;
  const dt = sec - lastSec;
  lastSec = sec;
  orbitLon += cfg.speed * dt;

  const date = now();
  const st = bodySun(date);
  const sun = st.sun;
  latLonToVec(sun.lat, sun.lon, sunDir);
  moonMesh.visible = shownBody === 'earth' && cfg.motion === 'earth-moon';
  updateMoon(date, st);
  if (issWanted()) iss.update(date, sunDir, sec);
  applyISS();
  updateCamera(Math.min(dt, 2), st);
  updateUltra();
  // „Von der Erde aus“ kurz vor/nach der unteren Konjunktion: fast nur die Nachtseite ist zu sehen.
  // Dann die Silhouette schwach aufhellen, damit der Bildschirm nicht einfach schwarz wirkt.
  litFromEarth = 1;
  if (cfg.motion === 'earth' && st.earth && shownBody !== 'earth' && shownBody !== 'sun') {
    const e = latLonToVec(st.earth.lat, st.earth.lon, new THREE.Vector3());
    litFromEarth = (1 + e.dot(sunDir)) / 2;
  }
  if (planet.visible && BODIES[shownBody]?.ambient) {
    const boost = litFromEarth < 0.06 && shownBody !== 'moon' ? 0.012 : 0;
    planetMat.uniforms.ambient.value.setRGB(...BODIES[shownBody].ambient.map((a) => a + boost));
  }
  auroraLayers.forEach((l) => { l.material.uniforms.time.value = sec; });
  earthAuroraMat.uniforms.time.value = sec;
  if (sunMesh.visible) { sunMesh.quaternion.copy(camera.quaternion); sunMat.uniforms.time.value = sec; }
  planetMat.uniforms.flowTime.value = sec / 24;  // eine Strömungsphase dauert 24 s
  // Statische Wolken driften leicht, Live-Wolken bleiben geografisch korrekt
  cloudMat.uniforms.drift.value = liveCloudsActive() ? 0 : sec * 0.0002;

  if (cfg.hud) {
    const de = navigator.language.startsWith('de');
    const body = shownBody === 'earth' ? '' : BODIES[shownBody].name[de ? 'de' : 'en'] +
      (shownBody === 'sun' && sdoState === 'ok' ? (de ? ' (Live-Bild: NASA SDO)' : ' (live image: NASA SDO)') : '') + '  ·  ';
    const dist = st.earthDistance
      ? `  ·  ${st.earthDistance < 0.02 ? Math.round(st.earthDistance * 149597871).toLocaleString(de ? 'de-DE' : 'en-GB') + ' km'
                                        : st.earthDistance.toFixed(2).replace('.', de ? ',' : '.') + (de ? ' AE' : ' AU')}${de ? ' von der Erde' : ' from Earth'}`
      : '';
    if (issMode()) {
      hud.textContent = `ISS  ·  ${Math.round(iss.alt)} km  ·  ${Math.round(iss.speed).toLocaleString(de ? 'de-DE' : 'en-GB')} km/h  ·  ` +
        (de ? 'über ' : 'over ') + `${fmtCoord(iss.lat, 'N', 'S')}, ${fmtCoord(iss.lon, de ? 'O' : 'E', 'W')}` +
        (iss.inShadow ? (de ? '  ·  im Erdschatten' : '  ·  in Earth\'s shadow') : '') +
        (iss.live ? '' : (de ? '  ·  Bahndaten offline' : '  ·  offline orbit data'));
    } else
    hud.textContent = body + (cfg.place && shownBody !== 'sun' ? cfg.place + '  ·  ' : '') +
      date.toLocaleString(de ? 'de-DE' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' }) +
      (shownBody === 'sun' ? '' : de ? `  ·  Sonne im Zenit über ${fmtCoord(sun.lat, 'N', 'S')}, ${fmtCoord(sun.lon, 'O', 'W')}`
          : `  ·  Sun overhead at ${fmtCoord(sun.lat, 'N', 'S')}, ${fmtCoord(sun.lon, 'E', 'W')}`) +
      dist + (litFromEarth < 0.06 ? (de ? `  ·  steht fast genau zwischen Erde und Sonne – wir sehen die Nachtseite (${(litFromEarth * 100).toFixed(1).replace('.', ',')} % beleuchtet)`
                                          : `  ·  almost exactly between Earth and Sun – we see its night side (${(litFromEarth * 100).toFixed(1)} % lit)`) : '') +
      (liveCloudsActive() ? (de ? '  ·  Wolken live' : '  ·  Live clouds') : '') +
      (shownBody === 'earth' && cfg.fx && kpLive ? `  ·  ${de ? 'Polarlicht-Aktivität' : 'Aurora activity'} Kp ${kp.toFixed(1)}` : '') +
      (shownBody === 'earth' && cfg.iss ? (updateNextPass(date), passText(date, de)) : '') +
      (eclipse === 'solar' && (shownBody === 'earth' || shownBody === 'moon') ? (de ? '  ·  Sonnenfinsternis im Gange' : '  ·  Solar eclipse in progress') : '') +
      (eclipse === 'lunar' && (shownBody === 'earth' || shownBody === 'moon') ? (de ? '  ·  Mondfinsternis im Gange' : '  ·  Lunar eclipse in progress') : '') +
      (shownBody === 'earth' && cfg.motion === 'earth-moon'
        ? `  ·  ${de ? 'Mond' : 'Moon'} ${Math.round(moonNow.length() * 6378.137).toLocaleString(de ? 'de-DE' : 'en-GB')} km`
        : '');
  }
  renderer.render(scene, camera);
  if (issMode()) {
    iss.camera.near = issScale > 1 ? 5 : 0.5; iss.camera.far = issScale > 1 ? 2e4 : 2e4; iss.camera.updateProjectionMatrix();
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(iss.scene, iss.camera);
    renderer.autoClear = true;
  }
  placeIssLabel();

  const fps = desiredFps();
  const next = Math.max(0, 1000 / fps - (performance.now() - sec * 1000) - 4);
  lastRender = sec;
  if (!capture) schedule(fps >= cfg.fps ? 0 : next);
}

applyBody();
if (!P.has('capture')) requestRender();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  requestRender();
});
</script>
</body>
</html>
