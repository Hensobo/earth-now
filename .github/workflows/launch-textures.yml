# High-resolution Earth textures for the launch videos (design/launch/fetch-hires.sh).
# Runs on demand, or on a push whose commit message contains "[hires]".
name: Launch video textures

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hires]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install libvips
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvips-tools
      - name: Fetch textures
        run: bash design/launch/fetch-hires.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/launch/textures
          git commit -m "Add high-resolution textures for the launch videos" || exit 0
          git pull --rebase
          git push
