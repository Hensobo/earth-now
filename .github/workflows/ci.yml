# Builds the app on every push and pull request, checks the bundle and saves
# a DMG plus real screenshots of the app windows (English and German) as artifacts.
#
# Put "[screenshots]" in a commit message to have the screenshots committed to
# docs/screenshots/app/ on that branch ("[settings-scroll]": the scrolled settings series, see
# EARTHNOW_SETTINGS_SCROLL, to docs/screenshots/app/scroll/).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pushes run here; pull requests only when they come from a fork (avoids duplicate runs).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Use newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          echo "Using $XC"; swiftc --version

      - name: Build universal app and DMG
        run: ./release.sh

      - name: Check bundle
        run: |
          APP=EarthNow.app
          lipo -archs $APP/Contents/MacOS/EarthNow | tee /dev/stderr | grep -q "x86_64 arm64"
          plutil -lint $APP/Contents/Info.plist
          codesign --verify --strict --verbose=2 $APP
          test -f $APP/Contents/Resources/AppIcon.icns
          test -f $APP/Contents/Resources/web/index.html
          plutil -lint $APP/Contents/Resources/de.lproj/Localizable.strings

      - name: Test the DMG like a user would
        run: |
          DMG=$(ls dist/EarthNow-*.dmg | head -1)
          echo "::group::Image"
          hdiutil verify "$DMG"
          MNT=$(hdiutil attach -nobrowse -readonly "$DMG" | awk -F'\t' '/\/Volumes\//{print $NF}')
          ls -la "$MNT"
          test -d "$MNT/EarthNow.app"                      # the app
          test -L "$MNT/Applications"                      # drag-to-Applications shortcut
          echo "::endgroup::"
          echo "::group::Install into /Applications"
          rm -rf /Applications/EarthNow.app
          cp -R "$MNT/EarthNow.app" /Applications/
          hdiutil detach "$MNT"
          codesign --verify --deep --strict --verbose=2 /Applications/EarthNow.app
          lipo -archs /Applications/EarthNow.app/Contents/MacOS/EarthNow
          echo "::endgroup::"
          echo "::group::Gatekeeper, as after a download"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" /Applications/EarthNow.app
          spctl --assess --type execute --verbose /Applications/EarthNow.app \
            && echo "Gatekeeper accepts the app" \
            || echo "Gatekeeper: not notarized (expected) – users confirm once under Privacy & Security"
          xattr -dr com.apple.quarantine /Applications/EarthNow.app   # the documented Terminal fix
          echo "::endgroup::"
          echo "::group::Launch through LaunchServices, like a double-click"
          defaults delete io.github.hensobo.earthnow 2>/dev/null || true
          open /Applications/EarthNow.app
          sleep 12
          pgrep -x EarthNow                                 # still running = no crash at launch
          open /Applications/EarthNow.app                   # second launch opens the settings, no new instance
          sleep 4
          test "$(pgrep -x EarthNow | wc -l | tr -d ' ')" = 1
          pkill -x EarthNow; sleep 2
          echo "::endgroup::"
          echo "::group::Render check and JavaScript errors"
          mkdir -p shots
          EARTHNOW_SNAPSHOT=$PWD/shots/dmg-desktop.png /Applications/EarthNow.app/Contents/MacOS/EarthNow > app.log 2>&1 &
          PID=$!; sleep 14
          kill -0 $PID                                      # alive after 14 s
          kill $PID; wait $PID 2>/dev/null || true
          test -s shots/dmg-desktop.png
          cat app.log
          if grep -q '\[web\]' app.log; then echo "::error::JavaScript errors in the renderer"; exit 1; fi
          if ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i earthnow; then echo "::error::crash report"; exit 1; fi
          echo "::endgroup::"

      - name: Screenshots of the app windows
        run: |
          mkdir -p shots
          # name  language  appearance  scroll   (all at the same moment, so the preview shows daylight)
          while read -r name lang look scroll; do
            EARTHNOW_SETTINGS=1 EARTHNOW_APPEARANCE=$look EARTHNOW_SETTINGS_SCROLL=$scroll \
            EARTHNOW_TIME=2026-06-21T14:30:00Z \
            EARTHNOW_SETTINGS_SNAPSHOT=$PWD/shots/settings-$name.png \
            EARTHNOW_SNAPSHOT=$PWD/shots/desktop-$name.png \
              EarthNow.app/Contents/MacOS/EarthNow -AppleLanguages "($lang)" &
            PID=$!
            sleep 15
            kill $PID || true
            wait $PID 2>/dev/null || true
          done <<'EOF'
          en-dark en dark top
          en-bottom en dark bottom
          en-light en light top
          de-light de light top
          EOF
          rm -f shots/dmg-desktop.png shots/desktop-en-dark.png shots/desktop-en-bottom.png shots/desktop-de-light.png
          ls -la shots

      - name: Settings scrolled from top to bottom (for the launch video)
        run: |
          mkdir -p shots/scroll
          for y in 0 120 240 360 480 600 720 840 960 1080 1200 bottom; do
            EARTHNOW_SETTINGS=1 EARTHNOW_APPEARANCE=dark EARTHNOW_SETTINGS_SCROLL=$y \
            EARTHNOW_TIME=2026-06-21T14:30:00Z \
            EARTHNOW_SETTINGS_SNAPSHOT=$PWD/shots/scroll/settings-scroll-$y.png \
              EarthNow.app/Contents/MacOS/EarthNow -AppleLanguages "(en)" > shots/scroll/settings-scroll-$y.txt 2>&1 &
            PID=$!
            sleep 12
            kill $PID || true
            wait $PID 2>/dev/null || true
            grep settings-scroll shots/scroll/settings-scroll-$y.txt || true
          done
          ls -la shots/scroll

      - name: Commit screenshots to the branch
        # "[screenshots]": the app screenshots; "[settings-scroll]": only the scrolled settings series
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[screenshots]') || contains(github.event.head_commit.message, '[settings-scroll]'))
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p docs/screenshots/app
          case "$MESSAGE" in *"[screenshots]"*) cp shots/*.png docs/screenshots/app/ ;; esac
          case "$MESSAGE" in *"[settings-scroll]"*) mkdir -p docs/screenshots/app/scroll && cp shots/scroll/* docs/screenshots/app/scroll/ ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/app
          git commit -m "Update app screenshots from CI" || exit 0
          git push

      - uses: actions/upload-artifact@v5
        with:
          name: EarthNow-dmg
          path: dist/*.dmg
          retention-days: 14

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: shots/
          retention-days: 14
          if-no-files-found: warn
