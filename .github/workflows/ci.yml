# Builds the app on every push and pull request, checks the bundle and saves
# a DMG plus real screenshots of the app windows (English and German) as artifacts.
#
# Put "[screenshots]" in a commit message to have the screenshots committed to
# docs/screenshots/app/ on that branch.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pushes run here; pull requests only when they come from a fork (avoids duplicate runs).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Use newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          echo "Using $XC"; swiftc --version

      - name: Build universal app and DMG
        run: ./release.sh

      - name: Check bundle
        run: |
          APP=EarthNow.app
          lipo -archs $APP/Contents/MacOS/EarthNow | tee /dev/stderr | grep -q "x86_64 arm64"
          plutil -lint $APP/Contents/Info.plist
          codesign --verify --strict --verbose=2 $APP
          test -f $APP/Contents/Resources/AppIcon.icns
          test -f $APP/Contents/Resources/web/index.html
          plutil -lint $APP/Contents/Resources/de.lproj/Localizable.strings

      - name: Screenshots of the app windows
        run: |
          mkdir -p shots
          for lang in en de; do
            EARTHNOW_SETTINGS=1 \
            EARTHNOW_SETTINGS_SNAPSHOT=$PWD/shots/settings-$lang.png \
            EARTHNOW_SNAPSHOT=$PWD/shots/desktop-$lang.png \
              EarthNow.app/Contents/MacOS/EarthNow -AppleLanguages "($lang)" &
            PID=$!
            sleep 14
            kill $PID || true
            wait $PID 2>/dev/null || true
          done
          ls -la shots

      - name: Commit screenshots to the branch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[screenshots]')
        run: |
          mkdir -p docs/screenshots/app
          cp shots/*.png docs/screenshots/app/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/app
          git commit -m "Update app screenshots from CI" || exit 0
          git push

      - uses: actions/upload-artifact@v5
        with:
          name: EarthNow-dmg
          path: dist/*.dmg
          retention-days: 14

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: shots/
          retention-days: 14
          if-no-files-found: warn
