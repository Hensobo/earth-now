# Publishes the website from site/ to GitHub Pages.
#
# Runs automatically on pushes to main – but only once the repository is public
# (GitHub Pages is not available for private repositories on free plans).
# One-time setup: Settings › Pages › Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: [site/**, web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # site/earth is a symlink to ../web – resolve it so the live Earth
      # (with textures and three.js) is deployed too.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -RL site/. _site/
          test -f _site/earth/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
